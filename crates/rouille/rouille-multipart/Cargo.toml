[package]
name = "rouille-multipart"
version = "0.18.0"
authors = ["Austin Bonander <austin.bonander@gmail.com>"]
description = "A backend-agnostic multipart/form-data implementation for synchronous HTTP clients and servers."
keywords = ["form-data", "http", "upload"]
repository = "http://github.com/abonander/multipart"
documentation = "http://docs.rs/multipart/"
license = "MIT OR Apache-2.0"
readme = "README.md"
autobins = false
edition = "2024"

[lints]
workspace = true

[dependencies]
lazy_static = { version = "1.5.0", optional = true }
log = "0.4"
mime = "0.3.17"
mime_guess = "2.0.5"
rand = "0.10"
safemem = { version = "0.3", optional = true }
tempfile = "3"

#Server Dependencies
buffer-redux = { version = "1.1", optional = true, default-features = false }
httparse = { version = "1.10", optional = true }
twoway = { version = "0.2", optional = true }
quick-error = { version = "2.0", optional = true }

# Optional Integrations

[dev-dependencies]
env_logger = "0.11"

[features]
client = []
default = ["client", "mock", "server"]
server = ["buffer-redux", "httparse", "quick-error", "safemem", "twoway"]
mock = []
