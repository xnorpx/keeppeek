[package]
name = "rouille"
version = "3.6.2"
authors = ["Pierre Krieger <pierre.krieger1708@gmail.com>"]
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/tomaka/rouille"
documentation = "http://docs.rs/rouille"
description = "High-level idiomatic web framework."
readme = "README.md"
keywords = ["web", "framework", "http", "rest"]
categories = ["web-programming::http-server", "web-programming::websocket"]

[lints]
workspace = true

[features]
default = ["gzip", "brotli"]
gzip = ["deflate"]

[dependencies]
base64 = "0.23"
brotli = { version = "8.0.4", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
filetime = "0.2.29"
deflate = { version = "1.0.0", optional = true, features = ["gzip"] }
rouille-multipart = { version = "0.18", path = "rouille-multipart", default-features = false, features = [
  "server",
] }
percent-encoding = "2"
rand = "0.10"
serde = "1"
serde_derive = "1"
serde_json = "1"
time = { version = "0.3.55", features = ["local-offset"] }
tiny_http = { version = "0.12.0", default-features = false }
url = "2"
threadpool = "1"
sha1_smol = "1.0.1"

[dev-dependencies]
postgres = { version = "0.19", default-features = false }
log = "0.4"
