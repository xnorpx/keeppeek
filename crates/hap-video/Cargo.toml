[package]
name = "hap-video"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
description = "Sans-I/O HomeKit camera protocol and str0m WebRTC session core"

[dependencies]
aes = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
ctr = "0.9"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.13"
httparse = "1"
num-bigint-dig = { version = "0.9", features = ["zeroize"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
str0m = { version = "0.23.0", default-features = false }
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[lints]
workspace = true
