[package]
name = "retina"
version = "0.4.19"
authors = ["Scott Lamb <slamb@slamb.org>"]
license = "MIT/Apache-2.0"
edition = "2024"
keywords = ["rtsp", "multimedia", "video", "streaming", "ip-camera"]
categories = ["network-programming", "multimedia"]
description = "high-level RTSP multimedia streaming library"
repository = "https://github.com/scottlamb/retina"
include = ["src/**/*", "benches", "Cargo.toml"]
rust-version = "1.88"

[features]
default = ["h265"]
h265 = []

[package.metadata.docs.rs]
# https://docs.rs/about/metadata
# To generate docs locally, run: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.0"
bitstream-io = "2.6"
bytes = "1.10"
derive_more = { version = "2", features = ["debug", "display", "error", "from"] }
h264-reader = "0.8.0"
hex = "0.4.3"
http-auth = "0.1.2"
jiff = "0.2.0"
log = "0.4.8"
memchr = "2.7.4"
mp4 = { path = "../mp4" }
pretty-hex = "0.4.0"
sdp-types = "0.1.4"
smallvec = { version = "1.6.1", features = ["union"] }
url = "2.2.1"

[dev-dependencies]
mylog = { git = "https://github.com/scottlamb/mylog" }
pretty_assertions = "1.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media"] }
