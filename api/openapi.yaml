# SPDX-License-Identifier: MIT
openapi: 3.1.1
info:
  title: KeepPeek API
  description: >-
    Create WebRTC sessions from gzip-compressed SDP offers, delete sessions, and
    read live and retained server logs plus Prometheus metrics through HTTP.
  version: unversioned
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8081"
security:
  - BearerCredential: []
  - BrowserSession: []
paths:
  /auth/session:
    get:
      operationId: authenticationSession
      summary: Discover sign-in methods and the current browser identity
      security: []
      description: >-
        Same-origin browser bootstrap. External authentication requires an exact
        configured HTTPS origin. An anonymous response can set a separate
        __Host-keeppeek-login cookie; trusted-proxy evidence can provision an
        identity. Configured trusted-local administration is unchanged. No
        candidate-plan parameter is accepted. All authentication responses use
        Cache-Control no-store and Referrer-Policy no-referrer.
      responses:
        "200":
          description: Sanitized identity, methods, and browser-bound CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/login:
    post:
      operationId: authenticationLogin
      summary: Start OIDC sign-in or prepared Administrator verification
      security: []
      description: >-
        Requires exact same-origin Origin and CSRF binding. Normal sign-in uses
        the anonymous login cookie. Candidate verification uses the one-use
        challenge prepared through protobuf on a live Administrator connection.
        Bearer headers cannot carry candidate evidence. Verification never
        replaces the authenticated browser cookie or activates candidate settings.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [provider_id, csrf_token]
              properties:
                provider_id:
                  type: string
                  maxLength: 64
                csrf_token:
                  type: string
                  maxLength: 128
                return_path:
                  type: string
                  description: Validated same-origin relative path; defaults to /.
                candidate_plan_id:
                  type: string
                  format: uuid
                  description: Verification ID from the prepared protobuf receipt.
      responses:
        "303":
          $ref: "#/components/responses/AuthenticationRedirect"
        "204":
          description: Candidate trusted-proxy evidence was verified without issuing a session.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Candidate verification is stale, unavailable, or already consumed.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/callback:
    get:
      operationId: authenticationCallback
      summary: Complete the one-use OIDC code flow
      security: []
      description: >-
        Validates the transaction cookie, state, provider, origin, nonce, PKCE,
        and ID token before provisioning a browser identity. Candidate callbacks
        record proof only for the original live control connection. Provider
        code, state, and tokens are never application bearer credentials and must
        not be logged. The response redirects to the validated saved return path.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: iss
          in: query
          schema:
            type: string
      responses:
        "303":
          $ref: "#/components/responses/AuthenticationRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Candidate verification or its parent session is unavailable.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/logout:
    post:
      operationId: authenticationLogout
      summary: Revoke the browser session and dependent control connections
      security: []
      description: >-
        Requires exact same-origin Origin and the CSRF token bound to the current
        browser or anonymous login cookie. Local revocation completes before any
        optional provider logout redirect. Clears both host-only cookies.
      parameters:
        - $ref: "#/components/parameters/BrowserCsrf"
      responses:
        "204":
          description: Browser session revoked and cookies cleared.
        "303":
          $ref: "#/components/responses/AuthenticationRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /create:
    post:
      operationId: create
      summary: Create a WebRTC session
      description: >-
        The complete JSON request body must use the gzip content encoding. A
        successful 201 response gzip-compresses the complete JSON create body,
        including the SDP answer, and sets Content-Encoding to gzip. See
        sdp-offer.md for the required SDP topology. The offer is the session's
        only RTP StreamId allocation; MIDs are opaque strings assigned by the
        offerer. This API does not renegotiate SDP. KeepPeek runs ICE Lite,
        always answers the client offer, and does not use trickle ICE. The
        offer need not contain ICE candidates.
        Cookie-authenticated requests require exact same-origin Origin and
        X-KeepPeek-CSRF. Combining a session cookie and bearer is rejected.
      parameters:
        - $ref: "#/components/parameters/GzipContentEncoding"
        - $ref: "#/components/parameters/BrowserCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
      responses:
        "201":
          description: The session was created.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOrigin"
            Content-Encoding:
              $ref: "#/components/headers/GzipContentEncoding"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "415":
          $ref: "#/components/responses/OfferNotGzipEncoded"
        "422":
          $ref: "#/components/responses/OfferRejected"
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      operationId: createOptions
      summary: CORS preflight for session create
      description: >-
        Required for browser clients that send Authorization and
        Content-Encoding. Allowed origins are configured server-side.
      security: []
      responses:
        "204":
          description: Preflight accepted for a configured origin.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOrigin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/AccessControlAllowMethods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/AccessControlAllowHeaders"
        "403":
          $ref: "#/components/responses/CorsOriginRejected"
  /delete:
    post:
      operationId: delete
      summary: Delete a WebRTC session
      description: >-
        Only the authenticated principal and effective address that created the
        session can delete it. Unknown and previously deleted IDs are idempotent
        success responses; a known session owned by another caller returns 404.
        Cookie-authenticated requests require exact same-origin Origin and CSRF.
      parameters:
        - $ref: "#/components/parameters/BrowserCsrf"
        - name: Prefer
          in: header
          required: false
          description: Use `return=representation` when the client must observe a complete response body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: The session was deleted and a representation was requested.
          content:
            text/plain:
              schema:
                type: string
        "204":
          description: The session was deleted.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOrigin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      operationId: deleteOptions
      summary: CORS preflight for session delete
      description: >-
        Required for browser clients that send Authorization. Allowed origins
        are configured server-side.
      security: []
      responses:
        "204":
          description: Preflight accepted for a configured origin.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOrigin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/AccessControlAllowMethods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/AccessControlAllowHeaders"
        "403":
          $ref: "#/components/responses/CorsOriginRejected"

  /logs:
    get:
      operationId: logs
      summary: Read server logs as Server-Sent Events
      description: Each log event contains one JSON LogEntry payload.
      responses:
        "200":
          description: A stream of server log events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                log:
                  value: |
                    id: 42
                    event: log
                    data: {"sequence":42,"timestamp_ms":0,"level":"info","target":"keeppeek","message":"ready","fields":{}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /logs/snapshot:
    get:
      operationId: logSnapshot
      summary: Read the complete retained server log buffer
      description: >-
        Returns one finite snapshot containing every entry still retained by the
        bounded in-memory log hub. The response is not cached and is intended
        for diagnostics package creation rather than polling.
      responses:
        "200":
          description: The complete bounded retained log snapshot.
          headers:
            Cache-Control:
              description: Diagnostics snapshots must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /metrics:
    get:
      operationId: metrics
      summary: Read Prometheus metrics
      description: >-
        Returns Prometheus text exposition metrics, including camera and server
        health counters. Identity and PTZ support stay on the WebRTC
        ServerCapabilities snapshot. Local Administrators and remote
        Administrator credentials may scrape this endpoint.
      responses:
        "200":
          description: Prometheus text exposition metrics.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  parameters:
    BrowserCsrf:
      name: X-KeepPeek-CSRF
      in: header
      required: false
      description: Required for cookie-authenticated mutations; returned by same-origin browser bootstrap.
      schema:
        type: string
        maxLength: 128
    GzipContentEncoding:
      name: Content-Encoding
      in: header
      required: true
      description: >-
        Must be gzip. The complete UTF-8 JSON create request body is
        gzip-compressed.
      schema:
        type: string
        const: gzip
  headers:
    AccessControlAllowOrigin:
      description: Exact configured request Origin. Never `*`.
      schema:
        type: string
        minLength: 1
    AccessControlAllowMethods:
      description: Session bootstrap allows POST and OPTIONS.
      schema:
        type: string
        const: "POST, OPTIONS"
    AccessControlAllowHeaders:
      description: Headers sent by the browser card preflight.
      schema:
        type: string
        const: "Authorization, Content-Type, Content-Encoding, Prefer"
    GzipContentEncoding:
      description: >-
        A successful create response gzip-compresses the complete UTF-8 JSON
        body, including answer.sdp.
      required: true
      schema:
        type: string
        const: gzip
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-keeppeek-session
      description: >-
        Opaque server-owned browser session, Secure, HttpOnly, SameSite=Lax,
        host-only, Path=/. Never combine with a bearer credential. Mutations
        require exact same-origin Origin and X-KeepPeek-CSRF. Proxy identities
        also require corroborating assertions from the configured immediate peer.
    BearerCredential:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: >-
        A named random UUID credential assigned Administrator or User. Required
        for remote peers when bearer authentication is enabled. Configured local networks act
        as Administrator without a credential. Forwarded clients are resolved
        only through the exact trusted-proxy contract.
  responses:
    AuthenticationRedirect:
      description: >-
        Redirect to the configured identity provider or validated saved return
        path. May set or clear the host-only Secure HttpOnly SameSite=Lax cookies.
        Uses Cache-Control no-store and Referrer-Policy no-referrer.
      headers:
        Location:
          required: true
          schema:
            type: string
    BadRequest:
      description: Bad Request. The request could not be accepted, or validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    OfferNotGzipEncoded:
      description: The request did not use gzip encoding.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    OfferRejected:
      description: The SDP offer validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Unauthorized:
      description: >-
        A remote request has no active credential or browser identity. The
        response does not distinguish unknown, disabled, expired, or revoked
        credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    SessionNotFound:
      description: A known session is owned by another principal or effective address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Forbidden:
      description: The role, mapping, Origin, or CSRF policy rejects this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    UpgradeRequired:
      description: Direct remote access requires HTTPS or a configured trusted proxy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    RateLimited:
      description: Remote authentication or active session capacity is temporarily limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    CorsOriginRejected:
      description: The request Origin is not in the configured allowed-origin list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Unavailable:
      description: KeepPeek cannot currently serve the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
  schemas:
    AuthenticationSession:
      type: object
      additionalProperties: false
      required: [local, bearer_enabled, methods, identity, csrf_token]
      properties:
        local:
          type: boolean
        bearer_enabled:
          type: boolean
        csrf_token:
          type: [string, "null"]
        methods:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [id, name, kind]
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
                enum: [oidc, proxy]
        identity:
          type: [object, "null"]
          additionalProperties: false
          required: [id, display_name, role]
          properties:
            id:
              type: string
            display_name:
              type: string
            provider_id:
              type: string
            role:
              type: string
              enum: [administrator, user]
    CreateRequest:
      type: object
      additionalProperties: false
      description: >-
        The UTF-8 JSON representation of this object is the gzip-compressed HTTP
        request body.
      required:
        - offer
      properties:
        offer:
          $ref: "#/components/schemas/SdpOffer"
    CreateResponse:
      type: object
      additionalProperties: false
      description: >-
        The UTF-8 JSON representation of this object is the gzip-compressed HTTP
        201 response body.
      required:
        - session_id
        - answer
      properties:
        session_id:
          type: string
          minLength: 1
          description: Opaque identifier used by its creator with /delete.
        answer:
          $ref: "#/components/schemas/SdpAnswer"
    DeleteRequest:
      type: object
      additionalProperties: false
      required:
        - session_id
      properties:
        session_id:
          type: string
          minLength: 1
    SdpOffer:
      type: object
      additionalProperties: false
      required:
        - type
        - sdp
      properties:
        type:
          type: string
          const: offer
        sdp:
          type: string
          minLength: 1
          description: >-
            SDP offer validated according to sdp-offer.md. ICE candidates are
            not required.
    SdpAnswer:
      type: object
      additionalProperties: false
      required:
        - type
        - sdp
      properties:
        type:
          type: string
          const: answer
        sdp:
          type: string
          minLength: 1
    LogEntry:
      type: object
      additionalProperties: false
      required:
        - sequence
        - timestamp_ms
        - level
        - target
        - message
        - fields
      properties:
        sequence:
          type: integer
          format: uint64
        timestamp_ms:
          type: integer
          format: uint64
        level:
          type: string
          enum:
            - trace
            - debug
            - info
            - warn
            - error
        target:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: true
        file:
          type: string
        line:
          type: integer
          minimum: 0
    LogBufferStats:
      type: object
      additionalProperties: false
      required:
        - entry_count
        - byte_count
        - evicted_entries
        - max_entries
        - max_bytes
        - active_streams
        - max_streams
      properties:
        entry_count:
          type: integer
          minimum: 0
        byte_count:
          type: integer
          minimum: 0
        evicted_entries:
          type: integer
          format: uint64
        max_entries:
          type: integer
          minimum: 1
        max_bytes:
          type: integer
          minimum: 1
        active_streams:
          type: integer
          minimum: 0
        max_streams:
          type: integer
          minimum: 1
    LogSnapshot:
      type: object
      additionalProperties: false
      required:
        - entries
        - oldest_sequence
        - newest_sequence
        - truncated
        - stats
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        oldest_sequence:
          type:
            - integer
            - "null"
          format: uint64
        newest_sequence:
          type:
            - integer
            - "null"
          format: uint64
        truncated:
          type: boolean
        stats:
          $ref: "#/components/schemas/LogBufferStats"
    Status:
      type: object
      additionalProperties: false
      description: Defines a logical error model that is surfaced through HTTP responses.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
