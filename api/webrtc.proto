message Event {
  string event_id = 1;
  uint64 revision = 2;
  string source_id = 3;
  optional MediaKind media_kind = 4;
  EventOrigin origin = 5;
  string event_type = 6;
  google.protobuf.Timestamp start_time = 7;
  // Absence represents a point event at start_time for range matching.
  optional google.protobuf.Timestamp end_time = 8;
  optional double confidence = 9;
  EventBoundingBox bounding_box = 10;
  optional string zone = 11;
  optional string text = 12;
  google.protobuf.Struct payload = 13;
  repeated EventAttachmentDescriptor attachments = 14;
  // Live source session. Required when publishing; set on live delivery.
  optional string source_session_id = 15;
  // Live delivery only: the event subscription that selected this event.
  optional string subscription_id = 16;
  // Producer-selected representative attachment in this event revision.
  optional string canonical_attachment_id = 17;
  // Bounded semantic presentation hint; event_type remains authoritative.
  optional string icon_key = 18;
  // Bounded producer hint retained only when icon_key was normalized to a fallback.
  optional string rejected_icon_key = 19;
  // Attachment whose image coordinate space owns bounding_box.
  optional string bounding_box_attachment_id = 20;
