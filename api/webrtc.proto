  MediaVariantCapability video_profile = 2;
  repeated PublicationTransport publication_transports = 3;
  repeated DeliveryTransport subscription_transports = 4;
  uint32 max_participants = 5;
  PublicationRecordingPolicy audio_recording_policy = 6;
  PublicationRecordingPolicy video_recording_policy = 7;
  // Zero means the server default.
  google.protobuf.Duration participant_timeout = 8;
  // JoinGroup must carry the group password, which is never returned.
  bool password_required = 9;
}

