message WebRtcSourceHealthSnapshot {
  string camera_ip = 1;
  string stream = 2;
  uint64 subscribers = 3;
  optional uint64 bitrate_bps = 4;
  bool has_keyframe = 5;
  optional uint64 keyframe_age_ms = 6;
}

message LoggingSettingsResult {
  string active_filter = 1;
  string default_filter = 2;
  optional string filter_error = 3;
  string version = 4;
  LogBufferStats buffer = 5;
}

message LogBufferStats {
  uint64 entry_count = 1;
  uint64 byte_count = 2;
  uint64 evicted_entries = 3;
  uint64 max_entries = 4;
  uint64 max_bytes = 5;
  uint64 active_streams = 6;
  uint64 max_streams = 7;
}

message RestartResult {
  bool restarting = 1;
}

message AccessKeyResult {
  string access_key = 1;
  bool rotated = 2;
}

message AccessCredential {
  string credential_id = 1;
  string name = 2;
  optional string description = 3;
  AccessRole role = 4;
  int64 created_at_ms = 5;
  optional int64 last_used_at_ms = 6;
  optional int64 expires_at_ms = 7;
  bool disabled = 8;
  optional int64 revoked_at_ms = 9;
  uint64 revision = 10;
  optional int64 rotated_at_ms = 11;
  bool initial_access_key_pending = 12;
}

message AccessCredentialResult {
  repeated AccessCredential credentials = 1;
  optional string access_key = 2;
}

message AccessSession {
  string session_id = 1;
  string principal_id = 2;
  string display_name = 3;
  AccessRole role = 4;
  bool local = 5;
  string client_classification = 6;
  int64 created_at_ms = 7;
  int64 last_activity_at_ms = 8;
  int64 absolute_expires_at_ms = 9;
  optional int64 credential_expires_at_ms = 10;
}

message AccessSessionResult {
  AccessSession current = 1;
  repeated AccessSession sessions = 2;
}

message AccessAuditEvent {
  string event_id = 1;
  int64 timestamp_ms = 2;
  optional string principal_id = 3;
  AccessRole role = 4;
  string action = 5;
  optional string target_id = 6;
  string result = 7;
  string client_classification = 8;
}

message AccessAuditResult {
  repeated AccessAuditEvent events = 1;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}

message CameraControlError {
  string source_id = 1;
  CameraControlErrorCode code = 2;
}

enum CameraControlErrorCode {
  CAMERA_CONTROL_ERROR_CODE_UNSPECIFIED = 0;
  CAMERA_CONTROL_ERROR_CODE_SOURCE_NOT_FOUND = 1;
  CAMERA_CONTROL_ERROR_CODE_PTZ_UNSUPPORTED = 2;
  CAMERA_CONTROL_ERROR_CODE_PRESET_NOT_FOUND = 3;
  CAMERA_CONTROL_ERROR_CODE_UNAVAILABLE = 4;
  CAMERA_CONTROL_ERROR_CODE_INVALID = 5;
}

message GroupError {
  string group_id = 1;
  GroupErrorCode code = 2;
}

enum GroupErrorCode {
  GROUP_ERROR_CODE_UNSPECIFIED = 0;
  GROUP_ERROR_CODE_NOT_FOUND = 1;
  GROUP_ERROR_CODE_FULL = 2;
  GROUP_ERROR_CODE_NOT_JOINED = 3;
  GROUP_ERROR_CODE_PUBLICATION_INVALID = 4;
  GROUP_ERROR_CODE_PROFILE_MISMATCH = 5;
  GROUP_ERROR_CODE_PASSWORD_REQUIRED = 6;
  GROUP_ERROR_CODE_PASSWORD_INVALID = 7;
  // Join requested on a view-only group with no live capability.
  GROUP_ERROR_CODE_NOT_LIVE = 8;
}

message StateStoreError {
  string namespace = 1;
  string key = 2;
  StateStoreErrorCode code = 3;
  optional uint64 current_revision = 4;
}

enum StateStoreErrorCode {
  STATE_STORE_ERROR_CODE_UNSPECIFIED = 0;
  STATE_STORE_ERROR_CODE_NOT_FOUND = 1;
  STATE_STORE_ERROR_CODE_NOT_AUTHORIZED = 2;
  STATE_STORE_ERROR_CODE_CONFLICT = 3;
  STATE_STORE_ERROR_CODE_NAMESPACE_INVALID = 4;
  STATE_STORE_ERROR_CODE_KEY_INVALID = 5;
  STATE_STORE_ERROR_CODE_SCHEMA_INVALID = 6;
  STATE_STORE_ERROR_CODE_VALUE_TOO_LARGE = 7;
  STATE_STORE_ERROR_CODE_TTL_INVALID = 8;
  STATE_STORE_ERROR_CODE_WATCH_NOT_FOUND = 9;
  STATE_STORE_ERROR_CODE_WATCH_LIMIT_EXCEEDED = 10;
  STATE_STORE_ERROR_CODE_SNAPSHOT_TOO_LARGE = 11;
}

message EventPublicationError {
  string publication_id = 1;
  string event_id = 2;
  EventPublicationErrorCode code = 3;
  optional uint64 current_revision = 4;
}

enum EventPublicationErrorCode {
  EVENT_PUBLICATION_ERROR_CODE_UNSPECIFIED = 0;
  EVENT_PUBLICATION_ERROR_CODE_SOURCE_NOT_FOUND = 1;
  EVENT_PUBLICATION_ERROR_CODE_EVENT_INVALID = 2;
  EVENT_PUBLICATION_ERROR_CODE_REVISION_CONFLICT = 3;
  EVENT_PUBLICATION_ERROR_CODE_ATTACHMENT_INVALID = 4;
  EVENT_PUBLICATION_ERROR_CODE_ATTACHMENTS_INCOMPLETE = 5;
  EVENT_PUBLICATION_ERROR_CODE_SIZE_LIMIT_EXCEEDED = 6;
  EVENT_PUBLICATION_ERROR_CODE_EXPIRED = 7;
  EVENT_PUBLICATION_ERROR_CODE_STATE_INVALID = 8;
  EVENT_PUBLICATION_ERROR_CODE_STORAGE_UNAVAILABLE = 9;
  EVENT_PUBLICATION_ERROR_CODE_ATTACHMENT_COUNT_MISMATCH = 10;
}

message PublicationError {
  string publication_id = 1;
  PublicationErrorCode code = 2;
}

enum PublicationErrorCode {
  PUBLICATION_ERROR_CODE_UNSPECIFIED = 0;
  PUBLICATION_ERROR_CODE_SOURCE_NOT_FOUND = 1;
  PUBLICATION_ERROR_CODE_TRANSPORT_UNAVAILABLE = 2;
  PUBLICATION_ERROR_CODE_CODEC_UNAVAILABLE = 3;
  PUBLICATION_ERROR_CODE_FORMAT_INVALID = 4;
  PUBLICATION_ERROR_CODE_SIMULCAST_INVALID = 5;
  PUBLICATION_ERROR_CODE_CONNECTION_LIMITED = 6;
  PUBLICATION_ERROR_CODE_STREAM_NOT_FOUND = 7;
  PUBLICATION_ERROR_CODE_VARIANT_CONFLICT = 8;
  PUBLICATION_ERROR_CODE_LINEAGE_INVALID = 9;
  PUBLICATION_ERROR_CODE_CONTROL_UNSUPPORTED = 10;
  PUBLICATION_ERROR_CODE_TIMELINE_CONFLICT = 11;
  PUBLICATION_ERROR_CODE_RECORDING_POLICY_REJECTED = 12;
  PUBLICATION_ERROR_CODE_RECORDING_UNAVAILABLE = 13;
  PUBLICATION_ERROR_CODE_RECORDING_MODE_INVALID = 14;
  PUBLICATION_ERROR_CODE_RTP_MID_NOT_FOUND = 15;
  PUBLICATION_ERROR_CODE_RTP_MID_INCOMPATIBLE = 16;
  PUBLICATION_ERROR_CODE_RTP_MID_UNAVAILABLE = 17;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_REQUEST = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_REJECTED = 4;
  ERROR_CODE_UNAVAILABLE = 5;
  ERROR_CODE_TIMEOUT = 6;
  ERROR_CODE_INTERNAL = 7;
}

message Message {
  oneof message {
    AudioMessage audio = 1;
    VideoMessage video = 2;
    DataMessage data = 3;
    StoredMediaMessage stored_media = 4;
    StoredMediaQueryMessage stored_media_query = 5;
    EventMessage event = 6;
    ExportMessage export = 7;
    EventSearchMessage event_search = 8;
  }
}

message ExportMessage {
  oneof message {
    ExportFileChunk file_chunk = 1;
  }
}

message ExportFileChunk {
  string job_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  bytes payload = 4;
}

message EventSearchMessage {
  oneof message {
    EventSearchResult result = 1;
    EventSearchQueryEnd query_end = 2;
    EventSearchMediaChunk media_chunk = 3;
    EventSearchMediaEnd media_end = 4;
    EventSearchError error = 5;
  }
}

message EventSearchResult {
  string query_id = 1;
  uint64 sequence = 2;
  EventSearchHit hit = 3;
}

message EventSearchHit {
  string event_id = 1;
  string source_id = 2;
  string event_type = 3;
  google.protobuf.Timestamp start_time = 4;
  optional google.protobuf.Timestamp end_time = 5;
  optional double score = 6;
  google.protobuf.Timestamp preview_start_time = 7;
  google.protobuf.Timestamp preview_end_time = 8;
  repeated EventSearchKeyframe keyframes = 9;
  bool keyframes_truncated = 10;
  EventOrigin origin = 11;
  optional double confidence = 12;
  EventBoundingBox bounding_box = 13;
  optional string zone = 14;
  optional string text = 15;
  bool has_image_attachment = 16;
  uint64 revision = 17;
  optional EventAttachmentDescriptor canonical_attachment = 18;
  optional string icon_key = 19;
  optional string rejected_icon_key = 20;
  optional string bounding_box_attachment_id = 21;
  EventImageAvailability image_availability = 22;
  repeated EventAttachmentDescriptor attachments = 23;
}

message EventSearchKeyframe {
  string source_id = 1;
  string stream_id = 2;
  string recording_id = 3;
  uint64 fragment_sequence = 4;
  google.protobuf.Timestamp event_time = 5;
  google.protobuf.Timestamp fragment_start_time = 6;
  uint64 byte_len = 7;
}

message EventSearchQueryEnd {
  string query_id = 1;
  uint64 result_count = 2;
  optional uint32 next_offset = 3;
  string next_page_token = 4;
  bool candidates_truncated = 5;
}

message EventSearchMediaChunk {
  string transfer_id = 1;
  string object_id = 2;
  StoredMediaObjectRepresentation representation = 3;
  string content_type = 4;
  uint64 byte_len = 5;
  uint32 chunk_index = 6;
  uint32 chunk_count = 7;
  bytes payload = 8;
  string recording_id = 9;
  uint64 fragment_sequence = 10;
  string codec = 11;
  uint32 width = 12;
  uint32 height = 13;
  bytes decoder_config = 14;
  uint32 nal_length_size = 15;
  string event_id = 16;
  uint64 event_revision = 17;
  string attachment_id = 18;
}

message EventSearchMediaEnd {
  string transfer_id = 1;
  uint32 object_count = 2;
}

message EventSearchError {
  oneof context {
    string query_id = 1;
    string transfer_id = 2;
  }
  ErrorCode code = 3;
  string message = 4;
}

message AudioMessage {
  oneof message {
    AudioDataFrame frame = 1;
  }
}

message VideoMessage {
  oneof message {
    VideoDataFrame frame = 1;
  }
}

message DataMessage {
  oneof message {
    DataPayloadFrame payload = 1;
  }
}

message EventMessage {
  oneof message {
    EventAttachmentChunk attachment = 1;
  }
}

message DataPayloadFrame {
  string subscription_id = 1;
  string source_session_id = 2;
  string payload_type = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp timestamp = 5;
  bytes payload = 6;
}

message EventAttachmentChunk {
  oneof context {
    // Live fanout to one event subscription.
    string subscription_id = 1;
    // Client publication staging before commit.
    string publication_id = 2;
    // Stored timeline query result.
    string query_id = 3;
  }

  string event_id = 4;
  uint64 revision = 5;
  string attachment_id = 6;
  string attachment_type = 7;
  string content_type = 8;
  uint32 ordinal = 9;
  optional google.protobuf.Timestamp timestamp = 10;
  uint64 sequence = 11;
  uint32 chunk_index = 12;
  uint32 chunk_count = 13;
  bytes payload = 14;
}

message AudioDataFrame {
  string stream_binding_id = 1;
  uint64 frame_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint32 fragment_index = 4;
  uint32 fragment_count = 5;
  bytes payload = 6;
  google.protobuf.Duration duration = 7;
  uint64 configuration_revision = 8;
}

message VideoDataFrame {
  string stream_binding_id = 1;
  uint64 frame_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint32 fragment_index = 4;
  uint32 fragment_count = 5;
  bool key_frame = 6;
  bytes payload = 7;
  optional google.protobuf.Timestamp decode_time = 8;
  uint64 configuration_revision = 9;
}

message StoredMediaMessage {
  oneof message {
    StoredMediaInitialization initialization = 1;
    StoredMediaFragment fragment = 2;
    StoredMediaTimedData timed_data = 3;
    StoredMediaKeyFrame key_frame = 4;
  }
}

message StoredMediaKeyFrame {
  string stored_media_id = 1;
  uint64 generation = 2;
  MediaDataConfiguration configuration = 3;
  VideoDataFrame frame = 4;
}

message StoredMediaInitialization {
  string stored_media_id = 1;
  uint64 generation = 2;
  uint64 initialization_id = 3;
  string content_type = 4;
  uint32 chunk_index = 5;
  uint32 chunk_count = 6;
  bytes payload = 7;
}

message StoredMediaFragment {
  string stored_media_id = 1;
  uint64 generation = 2;
  uint64 initialization_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Duration duration = 6;
  uint32 chunk_index = 7;
  uint32 chunk_count = 8;
  bytes payload = 9;
}

message StoredMediaTimedData {
  string stored_media_id = 1;
  uint64 generation = 2;
  string payload_type = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp timestamp = 5;
  optional google.protobuf.Duration duration = 6;
  bytes payload = 7;
}

message StoredMediaQueryMessage {
  oneof message {
    StoredMediaQueryPage page = 1;
    StoredMediaQueryEnd end = 2;
  }
}

message StoredMediaQueryPage {
  string query_id = 1;
  uint64 sequence = 2;
  repeated StoredMediaRange availability = 3;
  repeated StoredMediaQueryData data = 4;
  repeated Event events = 5;
}

message StoredMediaRange {
  string source_id = 1;
  string stream_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

message StoredMediaQueryData {
  string source_id = 1;
  optional string stream_id = 2;
  string payload_type = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional google.protobuf.Duration duration = 5;
  bytes payload = 6;
}

enum EventOrigin {
  EVENT_ORIGIN_UNSPECIFIED = 0;
  EVENT_ORIGIN_CAMERA = 1;
  EVENT_ORIGIN_KEEPPEEK = 2;
}

message EventBoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message StoredMediaQueryEnd {
  string query_id = 1;
  uint64 page_count = 2;
  uint64 attachment_count = 3;
}

message EventMetadataSearch {
  repeated string source_ids = 1;
  repeated string event_types = 2;
  repeated EventOrigin origins = 3;
  repeated string zones = 4;
  optional double minimum_confidence = 5;
  EventImageFilter image = 6;
  optional string text = 7;
  repeated string event_ids = 8;
  bool include_preview_keyframes = 9;
}

enum EventImageFilter {
  EVENT_IMAGE_FILTER_ANY = 0;
  EVENT_IMAGE_FILTER_WITH_IMAGE = 1;
  EVENT_IMAGE_FILTER_WITHOUT_IMAGE = 2;
}
