// participants. Groups are server-defined and are not created over this API.
message GroupCapability {
  string group_id = 1;
  string display_name = 2;
  uint64 revision = 3;
  // Static source streams the group presents. Addressed by stable source_id
  // because a dynamic source_session_id would dangle across a reconnect.
  repeated GroupMember members = 4;
  // Absent in a view-only group that nobody can join.
  GroupLiveCapability live = 5;
}

