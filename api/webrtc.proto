message SourceSession {
  string source_session_id = 1;
  // Stable identity across source-session replacement. Empty for an
  // intentionally ephemeral source.
  string source_id = 2;
  string display_name = 3;
  // Message presence means this session currently exposes that media kind.
  MediaStreamCapability audio = 4;
  MediaStreamCapability video = 5;
  // Data payload types are unique within this source session.
  repeated DataPayloadCapability data_payloads = 6;
  repeated EventType event_types = 7;
  // At most one capability per MediaKind.
  repeated MediaPublicationCapability publication_capabilities = 8;
}

