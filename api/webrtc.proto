message Message {
  oneof message {
    AudioMessage audio = 1;
    VideoMessage video = 2;
    DataMessage data = 3;
    StoredMediaMessage stored_media = 4;
    StoredMediaQueryMessage stored_media_query = 5;
    EventMessage event = 6;
  }
}

message AudioMessage {
  oneof message {
    AudioDataFrame frame = 1;
  }
}

message VideoMessage {
  oneof message {
    VideoDataFrame frame = 1;
  }
}

message DataMessage {
  oneof message {
    DataPayloadFrame payload = 1;
  }
}

message EventMessage {
  oneof message {
    EventAttachmentChunk attachment = 1;
  }
}

message DataPayloadFrame {
  string subscription_id = 1;
  string source_session_id = 2;
  string payload_type = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp timestamp = 5;
  bytes payload = 6;
}

message EventAttachmentChunk {
  oneof context {
    // Live fanout to one event subscription.
    string subscription_id = 1;
    // Client publication staging before commit.
    string publication_id = 2;
    // Stored timeline query result.
    string query_id = 3;
  }

  string event_id = 4;
  uint64 revision = 5;
  string attachment_id = 6;
  string attachment_type = 7;
  string content_type = 8;
  uint32 ordinal = 9;
  optional google.protobuf.Timestamp timestamp = 10;
  uint64 sequence = 11;
  uint32 chunk_index = 12;
  uint32 chunk_count = 13;
  bytes payload = 14;
}

message AudioDataFrame {
  string stream_binding_id = 1;
  uint64 frame_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint32 fragment_index = 4;
  uint32 fragment_count = 5;
  bytes payload = 6;
  google.protobuf.Duration duration = 7;
  uint64 configuration_revision = 8;
}

message VideoDataFrame {
  string stream_binding_id = 1;
  uint64 frame_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint32 fragment_index = 4;
  uint32 fragment_count = 5;
  bool key_frame = 6;
  bytes payload = 7;
  optional google.protobuf.Timestamp decode_time = 8;
  uint64 configuration_revision = 9;
}

message StoredMediaMessage {
  oneof message {
    StoredMediaInitialization initialization = 1;
    StoredMediaFragment fragment = 2;
    StoredMediaTimedData timed_data = 3;
  }
}

message StoredMediaInitialization {
  string stored_media_id = 1;
  uint64 generation = 2;
  uint64 initialization_id = 3;
  string content_type = 4;
  uint32 chunk_index = 5;
  uint32 chunk_count = 6;
  bytes payload = 7;
}

message StoredMediaFragment {
  string stored_media_id = 1;
  uint64 generation = 2;
  uint64 initialization_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Duration duration = 6;
  uint32 chunk_index = 7;
  uint32 chunk_count = 8;
  bytes payload = 9;
}

message StoredMediaTimedData {
  string stored_media_id = 1;
  uint64 generation = 2;
  string payload_type = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp timestamp = 5;
  optional google.protobuf.Duration duration = 6;
  bytes payload = 7;
}

message StoredMediaQueryMessage {
  oneof message {
    StoredMediaQueryPage page = 1;
    StoredMediaQueryEnd end = 2;
  }
}

message StoredMediaQueryPage {
  string query_id = 1;
  uint64 sequence = 2;
  repeated StoredMediaRange availability = 3;
  repeated StoredMediaQueryData data = 4;
  repeated Event events = 5;
}

message StoredMediaRange {
  string source_id = 1;
  string stream_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

message StoredMediaQueryData {
  string source_id = 1;
  optional string stream_id = 2;
  string payload_type = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional google.protobuf.Duration duration = 5;
  bytes payload = 6;
}

enum EventOrigin {
  EVENT_ORIGIN_UNSPECIFIED = 0;
  EVENT_ORIGIN_CAMERA = 1;
  EVENT_ORIGIN_KEEPPEEK = 2;
}

message EventBoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message StoredMediaQueryEnd {
  string query_id = 1;
  uint64 page_count = 2;
  uint64 attachment_count = 3;
}