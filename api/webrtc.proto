    SubscriptionResult subscription_result = 1;
    StoredMediaQueryDelivery stored_media_query_delivery = 2;
    GroupList group_list = 3;
    PtzResult ptz_result = 4;
    PublicationState publication_state = 5;
    StoredMediaState stored_media_state = 6;
