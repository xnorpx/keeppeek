  PUBLICATION_RECORDING_POLICY_UNSPECIFIED = 0;
  PUBLICATION_RECORDING_POLICY_PROHIBITED = 1;
  PUBLICATION_RECORDING_POLICY_OPTIONAL = 2;
  PUBLICATION_RECORDING_POLICY_REQUIRED = 3;
}

