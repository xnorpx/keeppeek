syntax = "proto3";

package keeppeek.webrtc.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Next 7 lines deliberately violate AIP-136 (Custom RPC Envelope).
// This is required because this protocol operates over raw WebRTC DataChannels
// instead of HTTP/2 headers framing, thus necessitating application-level
// framing for multiplexing.
message ControlEnvelope {
  oneof message {
    Request request = 1;
    Response response = 2;
    Notification notification = 3;
  }
}

message Request {
  uint64 request_id = 1;
  oneof command {
    SubscribeMedia subscribe_media = 2;
    SubscribeEvents subscribe_events = 3;
    SubscribeData subscribe_data = 4;
    Unsubscribe unsubscribe = 5;
    PublishEvent publish_event = 6;
    PublicationCommand publication_command = 7;
    StoredMediaCommand stored_media_command = 8;
    EventPublicationCommand event_publication_command = 9;

    GroupCommand group_command = 11;
    StateStoreCommand state_store_command = 12;
    CameraControlCommand camera_control_command = 13;
    PublicationReport publication_report = 14;
    CameraConfigurationCommand camera_configuration_command = 15;
    RuntimeConfigurationCommand runtime_configuration_command = 16;
    LoggingCommand logging_command = 17;
    ServerCommand server_command = 18;
    HealthCommand health_command = 21;
    ExportCommand export_command = 22;
    EventSearchCommand event_search_command = 23;
    NotificationRuleCommand notification_rule_command = 24;
    ConfigurationCommand configuration_command = 25;
  }
  reserved 19, 20;
  reserved "recording_command", "live_session_command";
}

message Response {
  uint64 request_id = 1;
  oneof result {
    Ok ok = 2;
    Error error = 3;
  }
}

message Notification {
  oneof event {
    ServerCapabilities initial_capabilities = 1;
    ConnectionUpdate connection_update = 2;
    Event live_event = 3;
    MediaDataConfiguration media_data_configuration = 4;
    PublicationState publication_state = 5;
    StoredMediaState stored_media_state = 6;
    EventPublicationState event_publication_state = 7;
    GroupState group_state = 8;
    StateStoreWatchUpdate state_store_watch_update = 9;

    PublicationControl publication_control = 15;
    SubscriptionStreamState subscription_stream_state = 16;
    CameraUpdated camera_updated = 11;
    SourceSessionAdded source_session_added = 12;
    SourceSessionRemoved source_session_removed = 13;
    GroupMemberChanged group_member_changed = 14;
  }
}

message SubscriptionStreamState {
  string subscription_id = 1;
  string active_variant_id = 2;
}

message CameraUpdated {
  string source_id = 1;
  CameraInfo camera = 2;
}

message SourceSessionAdded {
  string source_session_id = 1;
  SourceSession session = 2;
}

message SourceSessionRemoved {
  string source_session_id = 1;
}

message GroupMemberChanged {
  string group_id = 1;
  repeated GroupMember members = 2;
}

message ServerCapabilities {
  uint64 revision = 1;
  // Configured cameras, including offline ones. Identity and device
  // capability only; numeric health is on GET /metrics and HealthCommand.
  repeated CameraInfo cameras = 2;
  // Complete source-session state visible to this connection.
  repeated SourceSession source_sessions = 3;
  repeated StoredMediaSourceCapability stored_media_sources = 4;
  // The source session owned by this WebRTC connection. It is present in this
  // connection's snapshot even before the session has active media.
  string self_source_session_id = 5;
  // Exact versioned server contracts. Unknown IDs must remain disabled.
  repeated string capability_ids = 6;
  AccessSession access_session = 7;
}

message CameraInfo {
  string source_id = 1;
  string display_name = 2;
  optional string manufacturer = 3;
  optional string model = 4;
  optional string firmware_version = 5;
  optional string serial_number = 6;
  optional string hardware_id = 7;
  optional string ip = 8;
  optional string hostname = 9;
  optional string mac_address = 10;
  optional string web_url = 11;
  optional uint32 http_port = 12;
  optional uint32 https_port = 13;
  optional uint32 rtsp_port = 14;
  optional uint32 onvif_port = 15;
  bool is_reolink = 16;
  CameraDeviceCapabilities device_capabilities = 17;
  PtzCapability ptz = 18;
}

message CameraDeviceCapabilities {
  bool audio = 1;
  bool events = 2;
  bool recording = 3;
  bool analytics = 4;
  bool imaging = 5;
  bool two_way_audio = 6;
}

message PtzCapability {
  // Authority for whether CameraControlCommand.ptz is accepted.
  bool supported = 5;
  bool continuous = 1;
  bool relative = 2;
  bool presets = 3;
  bool zoom = 4;
}

message CameraControlCommand {
  oneof action {
    PtzCommand ptz = 1;
    SetMotionDetection set_motion_detection = 2;
    SetCameraManufacturer set_manufacturer = 3;
    GetMotionDetection get_motion_detection = 4;
  }
}

message GetMotionDetection {
  string source_id = 1;
}

message SetMotionDetection {
  string source_id = 1;
  bool enabled = 2;
}

message SetCameraManufacturer {
  string source_id = 1;
  OptionalStringUpdate manufacturer = 2;
}

message PtzCommand {
  // Stable camera identity. Not source_session_id.
  string source_id = 1;
  oneof action {
    PtzContinuous continuous = 2;
    PtzStop stop = 3;
    PtzRelative relative = 4;
    PtzPresetList list_presets = 5;
    PtzPresetGoto goto_preset = 6;
    PtzPresetSave save_preset = 7;
    PtzPresetDelete delete_preset = 8;
  }
}

message PtzContinuous {
  // Each axis is -1.0 through 1.0. Zero means that axis is idle.
  float pan = 1;
  float tilt = 2;
  float zoom = 3;
}

message PtzStop {}

message PtzRelative {
  float pan = 1;
  float tilt = 2;
  float zoom = 3;
}

message PtzPresetList {}

message PtzPresetGoto {
  uint32 preset_id = 1;
}

message PtzPresetSave {
  uint32 preset_id = 1;
  string name = 2;
}

message PtzPresetDelete {
  uint32 preset_id = 1;
}

message PtzResult {
  string source_id = 1;
  repeated PtzPreset presets = 2;
}

message PtzPreset {
  uint32 preset_id = 1;
  string name = 2;
}

message CameraConfigurationCommand {
  oneof action {
    DiscoverCameras discover = 1;
    UpdateCameraConfiguration update = 2;
    RemoveCameraConfiguration remove = 3;
    GetCameraConfigurations get = 4;
    GetCameraCatalog get_catalog = 5;
    SearchCameraCatalog search_catalog = 6;
    ProbeCameraStreams probe_streams = 7;
    GetCameraOnboardingDefaults get_onboarding_defaults = 8;
    GetCameraDiscovery get_discovery = 9;
    CancelCameraDiscovery cancel_discovery = 10;
  }
}

message GetCameraConfigurations {}

message GetCameraCatalog {}

message GetCameraOnboardingDefaults {}

message SearchCameraCatalog {
  string query = 1;
  optional uint32 limit = 2;
  optional string ip = 3;
}

message ProbeCameraStreams {
  string ip = 1;
  string username = 2;
  string password = 3;
  optional uint32 onvif_port = 4;
  optional string main_rtsp_url = 5;
  optional string sub_rtsp_url = 6;
  optional CameraTransport transport = 7;
  optional bool query_onvif = 8;
}

message DiscoverCameras {
  repeated uint32 subnets = 1;
  repeated string networks = 2;
  string discovery_id = 3;
}

message GetCameraDiscovery {
  string discovery_id = 1;
}

message CancelCameraDiscovery {
  string discovery_id = 1;
}

message UpdateCameraConfiguration {
  string ip = 1;
  OptionalStringUpdate display_name = 2;
  OptionalStringUpdate manufacturer = 3;
  optional string username = 4;
  optional string password = 5;
  OptionalUint32Update onvif_port = 6;
  OptionalUint32Update http_port = 7;
  OptionalStringUpdate main_rtsp_url = 8;
  OptionalStringUpdate sub_rtsp_url = 9;
  OptionalStringUpdate uid = 10;
  optional CameraBackend backend = 11;
  optional CameraTransport transport = 12;
  optional bool record_generic_motion_events = 13;
  optional CameraRecordingMode recording_mode = 14;
  optional uint32 event_recording_duration_secs = 15;
  string expected_configuration_revision = 16;
}

message ConfigurationCommand {
  oneof action {
    GetConfigurationSnapshot get = 1;
    SaveConfigurationTemplate save_template = 2;
    DuplicateConfigurationTemplate duplicate_template = 3;
    DeleteConfigurationTemplate delete_template = 4;
    PlanConfigurationChange plan = 5;
    ApplyConfigurationPlan apply = 6;
    ExportConfigurationTemplates export_templates = 7;
    PreviewConfigurationTemplateImport preview_import = 8;
    ApplyConfigurationTemplateImport apply_import = 9;
  }
}

message GetConfigurationSnapshot {
  optional uint32 page_size = 1;
  string page_token = 2;
}

message SaveConfigurationTemplate {
  string expected_configuration_revision = 1;
  ConfigurationTemplate template = 2;
  optional uint64 expected_template_version = 3;
}

message DuplicateConfigurationTemplate {
  string expected_configuration_revision = 1;
  string template_id = 2;
  string name = 3;
}

message DeleteConfigurationTemplate {
  string expected_configuration_revision = 1;
  string template_id = 2;
}

message PlanConfigurationChange {
  string expected_configuration_revision = 1;
  ConfigurationTargetSelector targets = 2;
  ConfigurationChange change = 3;
}

message ConfigurationTargetSelector {
  oneof selection {
    CameraIdList camera_ids = 1;
    CameraConfigurationFilter filtered_cameras = 2;
    string group_id = 3;
    bool all_cameras = 4;
  }
}

message CameraIdList {
  repeated string camera_ids = 1;
}

message CameraConfigurationFilter {
  string search = 1;
  optional CameraBackend backend = 2;
  optional CameraRecordingMode recording_mode = 3;
}

message ConfigurationChange {
  oneof change {
    CameraConfigurationPatch patch = 1;
    string template_id = 2;
    CameraDefaultPatch defaults = 3;
  }
}

message CameraConfigurationPatch {
  OptionalStringUpdate display_name = 2;
  OptionalStringUpdate manufacturer = 3;
  OptionalStringUpdate username_secret_reference = 4;
  OptionalStringUpdate password_secret_reference = 5;
  OptionalUint32Update onvif_port = 6;
  OptionalUint32Update http_port = 7;
  OptionalStringUpdate main_rtsp_url = 8;
  OptionalStringUpdate sub_rtsp_url = 9;
  OptionalStringUpdate uid_secret_reference = 10;
  OptionalCameraBackendUpdate backend = 11;
  OptionalCameraTransportUpdate transport = 12;
  OptionalBoolUpdate record_generic_motion_events = 13;
  OptionalCameraRecordingModeUpdate recording_mode = 14;
  OptionalUint32Update event_recording_duration_secs = 15;
}

message CameraDefaultPatch {
  OptionalStringUpdate username_secret_reference = 1;
  OptionalStringUpdate password_secret_reference = 2;
  OptionalCameraBackendUpdate backend = 3;
  OptionalCameraTransportUpdate transport = 4;
  OptionalBoolUpdate record_generic_motion_events = 5;
  OptionalCameraRecordingModeUpdate recording_mode = 6;
  OptionalUint32Update event_recording_duration_secs = 7;
}

message CameraTemplateValues {
  optional string username_secret_reference = 1;
  optional string password_secret_reference = 2;
  optional uint32 onvif_port = 3;
  optional uint32 http_port = 4;
  optional CameraBackend backend = 5;
  optional CameraTransport transport = 6;
  optional bool record_generic_motion_events = 7;
  optional CameraRecordingMode recording_mode = 8;
  optional uint32 event_recording_duration_secs = 9;
}

message OptionalCameraBackendUpdate {
  oneof value {
    CameraBackend set = 1;
    bool clear = 2;
  }
}

message OptionalCameraTransportUpdate {
  oneof value {
    CameraTransport set = 1;
    bool clear = 2;
  }
}

message OptionalCameraRecordingModeUpdate {
  oneof value {
    CameraRecordingMode set = 1;
    bool clear = 2;
  }
}

message OptionalBoolUpdate {
  oneof value {
    bool set = 1;
    bool clear = 2;
  }
}

message ApplyConfigurationPlan {
  string plan_id = 1;
  string expected_configuration_revision = 2;
}

message ExportConfigurationTemplates {
  repeated string template_ids = 1;
}

message PreviewConfigurationTemplateImport {
  string expected_configuration_revision = 1;
  string document_json = 2;
}

message ApplyConfigurationTemplateImport {
  string preview_id = 1;
  string expected_configuration_revision = 2;
}

message ConfigurationTemplate {
  string template_id = 1;
  uint64 version = 2;
  string name = 3;
  string description = 4;
  CameraTemplateValues values = 5;
  int64 created_at_ms = 6;
  int64 updated_at_ms = 7;
}

message ConfigurationSnapshot {
  uint32 contract_version = 1;
  string configuration_revision = 2;
  CameraDefaultValues defaults = 3;
  repeated CameraEffectiveConfiguration cameras = 4;
  repeated ConfigurationTemplate templates = 5;
  ConfigurationLimits limits = 6;
  repeated ConfigurationDomain domains = 7;
  uint32 total_camera_count = 8;
  string next_page_token = 9;
}

message CameraDefaultValues {
  bool username_configured = 1;
  bool password_configured = 2;
  optional CameraBackend configured_backend = 3;
  CameraBackend effective_backend = 4;
  optional CameraTransport configured_transport = 5;
  CameraTransport effective_transport = 6;
  optional bool configured_record_generic_motion_events = 7;
  bool effective_record_generic_motion_events = 8;
  optional CameraRecordingMode configured_recording_mode = 9;
  CameraRecordingMode effective_recording_mode = 10;
  optional uint32 configured_event_recording_duration_secs = 11;
  uint32 effective_event_recording_duration_secs = 12;
}

message CameraEffectiveConfiguration {
  CameraSettings camera = 1;
  repeated string group_ids = 2;
  EffectiveSecretValue username = 3;
  EffectiveSecretValue password = 4;
  EffectiveCameraBackendValue backend = 5;
  EffectiveCameraTransportValue transport = 6;
  EffectiveBoolValue record_generic_motion_events = 7;
  EffectiveCameraRecordingModeValue recording_mode = 8;
  EffectiveUint32Value event_recording_duration_secs = 9;
}

message EffectiveSecretValue {
  bool default_configured = 1;
  bool override_configured = 2;
  bool effective_configured = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

message EffectiveCameraBackendValue {
  optional CameraBackend configured_default = 1;
  optional CameraBackend camera_override = 2;
  CameraBackend effective = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

message EffectiveCameraTransportValue {
  optional CameraTransport configured_default = 1;
  optional CameraTransport camera_override = 2;
  CameraTransport effective = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

message EffectiveCameraRecordingModeValue {
  optional CameraRecordingMode configured_default = 1;
  optional CameraRecordingMode camera_override = 2;
  CameraRecordingMode effective = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

message EffectiveBoolValue {
  optional bool configured_default = 1;
  optional bool camera_override = 2;
  bool effective = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

message EffectiveUint32Value {
  optional uint32 configured_default = 1;
  optional uint32 camera_override = 2;
  uint32 effective = 3;
  ConfigurationValueSource source = 4;
  bool runtime_applied = 5;
  optional string warning = 6;
}

enum ConfigurationValueSource {
  CONFIGURATION_VALUE_SOURCE_UNSPECIFIED = 0;
  CONFIGURATION_VALUE_SOURCE_BUILT_IN = 1;
  CONFIGURATION_VALUE_SOURCE_DEFAULT = 2;
  CONFIGURATION_VALUE_SOURCE_TEMPLATE = 3;
  CONFIGURATION_VALUE_SOURCE_OVERRIDE = 4;
}

message ConfigurationLimits {
  uint32 maximum_templates = 1;
  uint32 maximum_template_name_bytes = 2;
  uint32 maximum_template_description_bytes = 3;
  uint32 maximum_plan_targets = 4;
  uint32 maximum_import_bytes = 5;
}

message ConfigurationDomain {
  string domain_id = 1;
  string label = 2;
  string owner_path = 3;
  string capability_id = 4;
  bool readable = 5;
  bool mutable = 6;
  optional string unavailable_reason = 7;
}

message ConfigurationPlan {
  string plan_id = 1;
  string configuration_revision = 2;
  int64 expires_at_ms = 3;
  uint32 authoritative_target_count = 4;
  repeated ConfigurationPlanTarget targets = 5;
  repeated ConfigurationFieldChange changes = 6;
  repeated ConfigurationIssue issues = 7;
  ConfigurationImpact impact = 8;
  bool valid = 9;
  string apply_semantics = 10;
}

message ConfigurationPlanTarget {
  string camera_id = 1;
  string display_name = 2;
  repeated string group_ids = 3;
  bool skipped = 4;
  optional string skip_reason = 5;
}

message ConfigurationFieldChange {
  optional string camera_id = 1;
  string field = 2;
  string old_configured_value = 3;
  string old_effective_value = 4;
  string new_configured_value = 5;
  string new_effective_value = 6;
  ConfigurationValueSource source = 7;
  bool secret = 8;
}

message ConfigurationIssue {
  optional string camera_id = 1;
  string field = 2;
  ConfigurationIssueSeverity severity = 3;
  string code = 4;
  string message = 5;
  optional string required_capability = 6;
}

enum ConfigurationIssueSeverity {
  CONFIGURATION_ISSUE_SEVERITY_UNSPECIFIED = 0;
  CONFIGURATION_ISSUE_SEVERITY_INFO = 1;
  CONFIGURATION_ISSUE_SEVERITY_WARNING = 2;
  CONFIGURATION_ISSUE_SEVERITY_ERROR = 3;
}

enum ConfigurationImpact {
  CONFIGURATION_IMPACT_UNSPECIFIED = 0;
  CONFIGURATION_IMPACT_IMMEDIATE = 1;
  CONFIGURATION_IMPACT_RECONNECT_CAMERA = 2;
  CONFIGURATION_IMPACT_RESTART_COMPONENT = 3;
  CONFIGURATION_IMPACT_RESTART_SERVER = 4;
}

message ConfigurationApplyResult {
  string plan_id = 1;
  bool configuration_committed = 2;
  ConfigurationSnapshot snapshot = 3;
  repeated ConfigurationActivation activations = 4;
  ConfigurationImpact impact = 5;
}

message ConfigurationActivation {
  string camera_id = 1;
  ConfigurationActivationStatus status = 2;
  optional string detail = 3;
}

enum ConfigurationActivationStatus {
  CONFIGURATION_ACTIVATION_STATUS_UNSPECIFIED = 0;
  CONFIGURATION_ACTIVATION_STATUS_APPLIED = 1;
  CONFIGURATION_ACTIVATION_STATUS_RECONNECT_REQUIRED = 2;
  CONFIGURATION_ACTIVATION_STATUS_RESTART_REQUIRED = 3;
  CONFIGURATION_ACTIVATION_STATUS_FAILED = 4;
}

message ConfigurationTemplateDocumentResult {
  string document_json = 1;
}

message ConfigurationTemplateImportPreview {
  string preview_id = 1;
  string configuration_revision = 2;
  int64 expires_at_ms = 3;
  repeated ConfigurationTemplate templates = 4;
  repeated ConfigurationIssue issues = 5;
  bool valid = 6;
}

message ConfigurationError {
  ConfigurationErrorCode code = 1;
  string current_configuration_revision = 2;
  repeated ConfigurationIssue issues = 3;
}

enum ConfigurationErrorCode {
  CONFIGURATION_ERROR_CODE_UNSPECIFIED = 0;
  CONFIGURATION_ERROR_CODE_CONFLICT = 1;
  CONFIGURATION_ERROR_CODE_VALIDATION_FAILED = 2;
  CONFIGURATION_ERROR_CODE_PLAN_NOT_FOUND = 3;
  CONFIGURATION_ERROR_CODE_PLAN_EXPIRED = 4;
  CONFIGURATION_ERROR_CODE_TARGET_CHANGED = 5;
  CONFIGURATION_ERROR_CODE_CAPABILITY_LOST = 6;
  CONFIGURATION_ERROR_CODE_TEMPLATE_NOT_FOUND = 7;
  CONFIGURATION_ERROR_CODE_TEMPLATE_CONFLICT = 8;
  CONFIGURATION_ERROR_CODE_IMPORT_INVALID = 9;
}

message ConfigurationResult {
  oneof result {
    ConfigurationSnapshot snapshot = 1;
    ConfigurationTemplate template = 2;
    ConfigurationPlan plan = 3;
    ConfigurationApplyResult applied = 4;
    ConfigurationTemplateDocumentResult exported_templates = 5;
    ConfigurationTemplateImportPreview import_preview = 6;
  }
}

message RemoveCameraConfiguration {
  string ip = 1;
  string expected_configuration_revision = 2;
}

message OptionalStringUpdate {
  oneof value {
    string set = 1;
    bool clear = 2;
  }
}

message OptionalUint32Update {
  oneof value {
    uint32 set = 1;
    bool clear = 2;
  }
}

enum CameraBackend {
  CAMERA_BACKEND_UNSPECIFIED = 0;
  CAMERA_BACKEND_AUTO = 1;
  CAMERA_BACKEND_RETINA = 2;
  CAMERA_BACKEND_REO_PROTO = 3;
}
enum CameraRecordingMode {
  CAMERA_RECORDING_MODE_UNSPECIFIED = 0;
  CAMERA_RECORDING_MODE_SUB = 1;
  CAMERA_RECORDING_MODE_MAIN = 2;
  CAMERA_RECORDING_MODE_BOTH = 3;
  CAMERA_RECORDING_MODE_EVENT_BOOST = 4;
  CAMERA_RECORDING_MODE_OFF = 5;
}

enum CameraTransport {
  CAMERA_TRANSPORT_UNSPECIFIED = 0;
  CAMERA_TRANSPORT_TCP = 1;
  CAMERA_TRANSPORT_UDP = 2;
}

message RuntimeConfigurationCommand {
  oneof action {
    UpdateRuntimeConfiguration update = 1;
    GetRuntimeConfiguration get = 2;
    ProbeStorage probe_storage = 3;
  }
}

message GetRuntimeConfiguration {}

message ProbeStorage {
  string path = 1;
}

message HealthCommand {
  oneof action {
    GetHealth get = 1;
  }
}

message GetHealth {}

message ExportCommand {
  oneof action {
    CreateExportJob create = 1;
    ListExportJobs list = 2;
    GetExportJob get = 3;
    CancelExportJob cancel = 4;
    RetryExportJob retry = 5;
    DownloadExport download = 6;
  }
}

message CreateExportJob {
  string job_id = 1;
  string source_id = 2;
  string stream_id = 3;
  // The half-open export range. Its duration must not exceed two minutes.
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  bool allow_partial = 6;
  bool burn_in_timestamp = 7;
  optional EventExportSeed event_seed = 8;
}

message EventExportSeed {
  string event_id = 1;
  uint64 revision = 2;
  optional EventAttachmentDescriptor canonical_attachment = 3;
  optional string icon_key = 4;
  EventImageAvailability image_availability = 5;
}

message ListExportJobs {}

message GetExportJob {
  string job_id = 1;
}

message CancelExportJob {
  string job_id = 1;
}

message RetryExportJob {
  string job_id = 1;
}

message DownloadExport {
  string job_id = 1;
  DataChannelKind channel = 2;
}

enum ExportJobStatus {
  EXPORT_JOB_STATUS_UNSPECIFIED = 0;
  EXPORT_JOB_STATUS_RUNNING = 1;
  EXPORT_JOB_STATUS_PARTIAL = 2;
  EXPORT_JOB_STATUS_READY = 3;
  EXPORT_JOB_STATUS_FAILED = 4;
  EXPORT_JOB_STATUS_CANCELLED = 5;
  EXPORT_JOB_STATUS_EXPIRED = 6;
}

message ExportJob {
  string job_id = 1;
  string source_id = 2;
  string stream_id = 3;
  google.protobuf.Timestamp requested_start_time = 4;
  google.protobuf.Timestamp requested_end_time = 5;
  optional google.protobuf.Timestamp aligned_start_time = 6;
  ExportJobStatus status = 7;
  uint32 progress_per_mille = 8;
  uint64 bytes_written = 9;
  optional uint64 estimated_bytes = 10;
  // Filesystem-safe camera name and UTC start/end range, ending in `.mp4`.
  optional string file_name = 11;
  optional string sha256 = 12;
  optional google.protobuf.Timestamp expires_at = 13;
  repeated ExportMissingRange missing_ranges = 14;
  optional string error = 15;
  bool retryable = 16;
  bool burn_in_timestamp = 17;
  optional EventExportSeed event_seed = 18;
}

message ExportMissingRange {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

message ExportJobList {
  repeated ExportJob jobs = 1;
}

message ExportDownloadResult {
  ExportJob job = 1;
  DataChannelKind channel = 2;
  uint32 chunk_count = 3;
}

message EventSearchCommand {
  oneof action {
    ReplaceEventSearchTerms replace_terms = 1;
    SetEventSearchEmbedding set_embedding = 2;
    QueryEvents query = 3;
    CancelEventSearchQuery cancel_query = 4;
    FetchEventSearchMedia fetch_media = 5;
    CancelEventSearchMedia cancel_media = 6;
  }
}

message ReplaceEventSearchTerms {
  string event_id = 1;
  repeated EventSearchTerm terms = 2;
  string source_id = 3;
}

message SetEventSearchEmbedding {
  string event_id = 1;
  EventSearchEmbedding embedding = 2;
  string source_id = 3;
}

message EventSearchTerm {
  EventSearchField field = 1;
  string value = 2;
}

enum EventSearchField {
  EVENT_SEARCH_FIELD_UNSPECIFIED = 0;
  EVENT_SEARCH_FIELD_EVENT_TYPE = 1;
  EVENT_SEARCH_FIELD_FACE_NAME = 2;
  EVENT_SEARCH_FIELD_OBJECT_CLASS = 3;
  EVENT_SEARCH_FIELD_TEXT = 4;
}

message EventSearchEmbedding {
  string model_id = 1;
  repeated float values = 2;
}

message QueryEvents {
  string query_id = 1;
  oneof search {
    EventTextSearch text = 2;
    EventSemanticSearch semantic = 3;
    EventMetadataSearch metadata = 14;
  }
  optional string source_id = 4;
  string stream_id = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  optional google.protobuf.Duration preview_before = 8;
  optional google.protobuf.Duration preview_after = 9;
  uint32 page_size = 10;
  // Deprecated. New clients leave this zero and use page_token.
  uint32 offset = 11;
  DataChannelKind channel = 12;
  string page_token = 13;
}

message EventTextSearch {
  string query = 1;
  optional EventSearchField field = 2;
}

message EventSemanticSearch {
  EventSearchEmbedding embedding = 1;
}

message CancelEventSearchQuery {
  string query_id = 1;
}

message FetchEventSearchMedia {
  string transfer_id = 1;
  repeated EventSearchMediaObject objects = 2;
  DataChannelKind channel = 3;
}

