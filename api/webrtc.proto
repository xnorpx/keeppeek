  MEDIA_VARIANT_ORIGIN_TRANSCODED = 3;
  MEDIA_VARIANT_ORIGIN_GROUP = 4;
}

message MediaPublicationCapability {
  MediaKind kind = 1;
  repeated PublicationTransport transports = 2;
  repeated CodecDescriptor codecs = 3;
  uint32 max_active_variants = 4;
  uint32 max_width = 5;
  uint32 max_height = 6;
  uint32 max_sample_rate_hz = 7;
  uint32 max_channel_count = 8;
  uint64 max_nominal_bitrate_bps = 9;
  PublicationRecordingPolicy recording_policy = 10;
}

