name: Set up FFmpeg
description: Install and verify FFmpeg and FFprobe for recording media tests.
runs:
  using: composite
  steps:
    - name: Install FFmpeg on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
          for source in /etc/apt/sources.list.d/microsoft*.list; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
        fi
        ffmpeg -version
        ffprobe -version
    - name: Install FFmpeg on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
          brew install ffmpeg
        fi
        ffmpeg -version
        ffprobe -version
    - name: Install FFmpeg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        function Test-MediaTools {
          return (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
            (Get-Command ffprobe -ErrorAction SilentlyContinue)
        }
        if (-not (Test-MediaTools)) {
          $attempt = 1
          while ($attempt -le 3) {
            choco install ffmpeg --no-progress --yes
            if (Test-MediaTools) { break }
            if ($attempt -eq 3) { break }
            Start-Sleep -Seconds 10
            $attempt++
          }
        }
        if (-not (Test-MediaTools)) {
          winget install --id Gyan.FFmpeg --exact --source winget --silent --accept-source-agreements --accept-package-agreements
        }
        ffmpeg -version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ffprobe -version
