name: Set up FFmpeg
description: Install and verify the decoder required by recording media tests.
runs:
  using: composite
  steps:
    - name: Install FFmpeg on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          for source in /etc/apt/sources.list.d/microsoft*.list; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
        fi
        ffmpeg -version
    - name: Install FFmpeg on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          brew install ffmpeg
        fi
        ffmpeg -version
    - name: Install FFmpeg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
          $attempt = 1
          while ($attempt -le 3) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Unable to install FFmpeg' }
            Start-Sleep -Seconds 10
            $attempt++
          }
        }
        ffmpeg -version
