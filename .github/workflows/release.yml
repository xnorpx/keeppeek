# How to make a release
# - Update version in Cargo.toml:
#   version = "X.Y.Z"
# - Merge the PR to master.
# - Create a tag with the version number:
#   git tag X.Y.Z
# - Push the tag to GitHub:
#   git push origin X.Y.Z
# - Go to the releases page, edit the draft release, and publish it.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: version
        name: Read release version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Check release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: grep -Fx "version = \"$VERSION\"" Cargo.toml
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            installer_arch: x86_64
            extension: zip
            binary_extension: .exe
          - os: windows-11-arm
            platform: windows-aarch64
            installer_arch: aarch64
            extension: zip
            binary_extension: .exe
          - os: macos-latest
            platform: macos-aarch64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-latest
            platform: linux-x86_64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            extension: tar.gz
            binary_extension: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - name: Build release binary
        run: cargo build --release --bin keeppeek
      - name: Build release service binary
        if: runner.os == 'Windows'
        run: cargo build --release --bin keeppeek-service
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nsis --no-progress --yes
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARCH: ${{ matrix.installer_arch }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          build_dir="$(cygpath -w target/release)"
          "C:/Program Files (x86)/NSIS/makensis.exe" \
            "/DARCH=$ARCH" \
            "/DBUILD_DIR=$build_dir" \
            "/DOUT_DIR=." \
            "/DVERSION=$VERSION" \
            "/DVERSION_RESOURCE=$VERSION.0" \
            installer/keeppeek.nsi
      - name: Package release
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_EXTENSION: ${{ matrix.binary_extension }}
        run: |
          archive="keeppeek-${VERSION}-${PLATFORM}"
          mkdir "$archive"
          cp "target/release/keeppeek${BINARY_EXTENSION}" "$archive/"
          assets=""
          if [[ "$BINARY_EXTENSION" == ".exe" ]]; then
            cp target/release/keeppeek-service.exe "$archive/"
            standalone="keeppeek-${VERSION}-${PLATFORM}.exe"
            cp target/release/keeppeek.exe "$standalone"
            python -c 'import hashlib, pathlib; path = pathlib.Path("'"$standalone"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$standalone.sha256"
            installer="keeppeek-${VERSION}-${PLATFORM}-installer.exe"
            python -c 'import hashlib, pathlib; path = pathlib.Path("'"$installer"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$installer.sha256"
            assets="$standalone $standalone.sha256 $installer $installer.sha256"
          fi
          if [[ "$EXTENSION" == zip ]]; then
            7z a "$archive.zip" "$archive"
          else
            tar czf "$archive.tar.gz" "$archive"
          fi
          asset="$archive.$EXTENSION"
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$asset"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$asset.sha256"
          echo "assets=$asset $asset.sha256 $assets" >> "$GITHUB_OUTPUT"
      - name: Upload release archive
        env:
          ASSETS: ${{ steps.package.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "$VERSION" $ASSETS

  container:
    name: Publish container image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
