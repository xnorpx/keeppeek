# How to make a release
# - Update version in Cargo.toml:
#   version = "X.Y.Z"
# - Merge the PR to master.
# - Create a tag with the version number:
#   git tag X.Y.Z
# - Push the tag to GitHub:
#   git push origin X.Y.Z
# - Go to the releases page, edit the draft release, and publish it.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: version
        name: Read release version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Check release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: grep -Fx "version = \"$VERSION\"" Cargo.toml
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            extension: zip
            binary_extension: .exe
          - os: windows-11-arm
            platform: windows-aarch64
            extension: zip
            binary_extension: .exe
          - os: macos-15
            platform: macos-aarch64
            extension: dmg
            binary_extension: ""
          - os: ubuntu-latest
            platform: linux-x86_64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            extension: tar.gz
            binary_extension: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - name: Verify macOS architecture
        if: matrix.platform == 'macos-aarch64'
        run: test "$(uname -m)" = arm64
      - name: Build release binary
        run: cargo build --release --bin keeppeek
      - name: Configure macOS code signing
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_CERTIFICATE_BASE64" ]]; then
            exit 0
          fi
          if [[ -z "$MACOS_SIGNING_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "macOS signing requires certificate, certificate password, and identity secrets" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/keeppeek-signing.keychain-db"
          certificate="$RUNNER_TEMP/keeppeek-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$certificate"
          {
            echo "MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Package release
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_EXTENSION: ${{ matrix.binary_extension }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          archive="keeppeek-${VERSION}-${PLATFORM}"
          if [[ "$PLATFORM" == macos-aarch64 ]]; then
            staging_directory="$(mktemp -d)"
            app="$staging_directory/KeepPeek.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/KeepPeek.iconset"
            cp installer/macos/Info.plist "$app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$VERSION" "$app/Contents/Info.plist"
            swiftc installer/macos/KeepPeekLauncher.swift -o "$app/Contents/MacOS/KeepPeek"
            cp target/release/keeppeek "$app/Contents/Resources/keeppeek"
            chmod 755 "$app/Contents/MacOS/KeepPeek" "$app/Contents/Resources/keeppeek"
            for size in 16 32 128 256 512; do
              sips --resampleHeightWidth "$size" "$size" assets/readme_logo.jpeg --out "$app/Contents/Resources/KeepPeek.iconset/icon_${size}x${size}.png"
              doubled_size=$((size * 2))
              sips --resampleHeightWidth "$doubled_size" "$doubled_size" assets/readme_logo.jpeg --out "$app/Contents/Resources/KeepPeek.iconset/icon_${size}x${size}@2x.png"
            done
            iconutil --convert icns "$app/Contents/Resources/KeepPeek.iconset" --output "$app/Contents/Resources/KeepPeek.icns"
            rm -rf "$app/Contents/Resources/KeepPeek.iconset"
            if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" \
                "$app/Contents/Resources/keeppeek"
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" \
                "$app/Contents/MacOS/KeepPeek"
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            fi
            ln -s /Applications "$staging_directory/Applications"
            asset="$archive.$EXTENSION"
            hdiutil create -volname KeepPeek -srcfolder "$staging_directory" -ov -format UDZO "$asset"
            rm -rf "$staging_directory"
            if [[ -n "${MACOS_NOTARIZATION_APPLE_ID:-}" ]]; then
              if [[ -z "${MACOS_SIGNING_IDENTITY:-}" || -z "$MACOS_NOTARIZATION_PASSWORD" || -z "$MACOS_NOTARIZATION_TEAM_ID" ]]; then
                echo "macOS notarization requires signing, Apple ID, password, and team ID secrets" >&2
                exit 1
              fi
              xcrun notarytool submit "$asset" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait
              xcrun stapler staple "$asset"
              xcrun stapler validate "$asset"
            fi
          else
            mkdir "$archive"
            cp "target/release/keeppeek${BINARY_EXTENSION}" "$archive/"
            if [[ "$EXTENSION" == zip ]]; then
              7z a "$archive.zip" "$archive"
            else
              tar czf "$archive.tar.gz" "$archive"
            fi
            asset="$archive.$EXTENSION"
          fi
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$asset"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Upload release archive
        env:
          ASSET: ${{ steps.package.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "$VERSION" "$ASSET" "$ASSET.sha256"
      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi
