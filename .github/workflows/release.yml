# How to make a release
# - Update version in Cargo.toml:
#   version = "X.Y.Z"
# - Merge the PR to main.
# - Create a tag with the version number:
#   git tag X.Y.Z
# - Push the tag to GitHub:
#   git push origin X.Y.Z
# - Go to the releases page, edit the draft release, and publish it.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  RELEASE_REF_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  RELEASE_REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  create-release:
    name: Create Release
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_resource: ${{ steps.version.outputs.version_resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify tagged commit passed CI on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi
          successful_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "Release tag commit has no successful CI push run" >&2
            exit 1
          fi
      - id: version
        name: Read release version
        shell: bash
        run: |
          if [[ "$RELEASE_REF_TYPE" == branch ]]; then
            version=master
          else
            version="$RELEASE_REF_NAME"
          fi
          package_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ -z "$package_version" ]]; then
            echo "Unable to determine the package version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "version_resource=$package_version.0"
          } >> "$GITHUB_OUTPUT"
      - name: Check release version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: grep -Fx "version = \"$VERSION\"" Cargo.toml
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == branch ]]; then
            gh release delete "$VERSION" --yes || true
            git tag --force "$VERSION" "$RELEASE_SHA"
            git push --force origin "refs/tags/$VERSION"
            gh release create "$VERSION" --prerelease --verify-tag --title "$VERSION"
          else
            gh release create "$VERSION" --draft --verify-tag --title "$VERSION"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            installer_arch: x86_64
            extension: zip
            binary_extension: .exe
          - os: windows-11-arm
            platform: windows-aarch64
            installer_arch: aarch64
            extension: zip
            binary_extension: .exe
          - os: macos-latest
            platform: macos-aarch64
            extension: dmg
            binary_extension: ""
          - os: ubuntu-latest
            platform: linux-x86_64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            extension: tar.gz
            binary_extension: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Install and verify Rolldown Linux ARM64 binding
        if: matrix.platform == 'linux-aarch64'
        working-directory: ui
        shell: bash
        run: |
          binding='@rolldown/binding-linux-arm64-gnu'
          binding_version="$(bun -e "const packageJson = await Bun.file('node_modules/rolldown/package.json').json(); console.log(packageJson.optionalDependencies['$binding'])")"
          if [[ -z "$binding_version" || "$binding_version" == undefined ]]; then
            echo "Unable to determine $binding version" >&2
            exit 1
          fi
          bun add --no-save --exact "$binding@$binding_version" --registry=https://registry.npmjs.org/
          bun -e "await import('rolldown')"
      - name: Verify macOS architecture
        if: matrix.platform == 'macos-aarch64'
        run: test "$(uname -m)" = arm64
      - name: Build release binary
        run: cargo build --locked --release --bin keeppeek
      - name: Build release service binary
        if: runner.os == 'Windows'
        run: cargo build --locked --release --bin keeppeek-service
      - name: Upload unsigned Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ matrix.platform }}
          path: |
            target/release/keeppeek.exe
            target/release/keeppeek-service.exe
          if-no-files-found: error
          retention-days: 1
      - name: Configure macOS code signing
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_CERTIFICATE_BASE64" ]]; then
            exit 0
          fi
          if [[ -z "$MACOS_SIGNING_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "macOS signing requires certificate, certificate password, and identity secrets" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/keeppeek-signing.keychain-db"
          certificate="$RUNNER_TEMP/keeppeek-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$certificate"
          {
            echo "MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Package release
        if: runner.os != 'Windows'
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_EXTENSION: ${{ matrix.binary_extension }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          archive="keeppeek-${VERSION}-${PLATFORM}"
          assets=()
          if [[ "$PLATFORM" == macos-aarch64 ]]; then
            staging_directory="$(mktemp -d)"
            app="$staging_directory/KeepPeek.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/KeepPeek.iconset"
            cp installer/macos/Info.plist "$app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$VERSION" "$app/Contents/Info.plist"
            swiftc installer/macos/KeepPeekLauncher.swift -o "$app/Contents/MacOS/KeepPeek"
            cp target/release/keeppeek "$app/Contents/Resources/keeppeek"
            chmod 755 "$app/Contents/MacOS/KeepPeek" "$app/Contents/Resources/keeppeek"
            for size in 16 32 128 256 512; do
              sips --resampleHeightWidth "$size" "$size" --setProperty format png assets/readme_logo.jpeg --out "$app/Contents/Resources/KeepPeek.iconset/icon_${size}x${size}.png"
              doubled_size=$((size * 2))
              sips --resampleHeightWidth "$doubled_size" "$doubled_size" --setProperty format png assets/readme_logo.jpeg --out "$app/Contents/Resources/KeepPeek.iconset/icon_${size}x${size}@2x.png"
            done
            iconutil --convert icns "$app/Contents/Resources/KeepPeek.iconset" --output "$app/Contents/Resources/KeepPeek.icns"
            rm -rf "$app/Contents/Resources/KeepPeek.iconset"
            if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" \
                "$app/Contents/Resources/keeppeek"
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" \
                "$app/Contents/MacOS/KeepPeek"
              codesign --force --options runtime --timestamp \
                --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_SIGNING_IDENTITY" "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            fi
            ln -s /Applications "$staging_directory/Applications"
            asset="$archive.$EXTENSION"
            hdiutil create -volname KeepPeek -srcfolder "$staging_directory" -ov -format UDZO "$asset"
            rm -rf "$staging_directory"
            if [[ -n "${MACOS_NOTARIZATION_APPLE_ID:-}" ]]; then
              if [[ -z "${MACOS_SIGNING_IDENTITY:-}" || -z "$MACOS_NOTARIZATION_PASSWORD" || -z "$MACOS_NOTARIZATION_TEAM_ID" ]]; then
                echo "macOS notarization requires signing, Apple ID, password, and team ID secrets" >&2
                exit 1
              fi
              xcrun notarytool submit "$asset" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait
              xcrun stapler staple "$asset"
              xcrun stapler validate "$asset"
            fi
          else
            mkdir "$archive"
            cp "target/release/keeppeek${BINARY_EXTENSION}" "$archive/"
            if [[ "$BINARY_EXTENSION" == ".exe" ]]; then
              cp target/release/keeppeek-service.exe "$archive/"
              standalone="keeppeek-${VERSION}-${PLATFORM}.exe"
              cp target/release/keeppeek.exe "$standalone"
              python -c 'import hashlib, pathlib; path = pathlib.Path("'"$standalone"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$standalone.sha256"
              installer="keeppeek-${VERSION}-${PLATFORM}-installer.exe"
              python -c 'import hashlib, pathlib; path = pathlib.Path("'"$installer"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$installer.sha256"
              assets=("$standalone" "$standalone.sha256" "$installer" "$installer.sha256")
            fi
            if [[ "$EXTENSION" == zip ]]; then
              7z a "$archive.zip" "$archive"
            else
              tar czf "$archive.tar.gz" "$archive"
            fi
            asset="$archive.$EXTENSION"
          fi
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$asset"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$asset.sha256"
          package_assets=("$asset" "$asset.sha256" "${assets[@]}")
          for package_asset in "${package_assets[@]}"; do
            if [[ ! -f "$package_asset" ]]; then
              echo "Expected release asset was not created: $package_asset" >&2
              exit 1
            fi
          done
          echo "Packaged release assets:"
          printf '  %s\n' "${package_assets[@]}"
          {
            echo "assets<<EOF"
            printf '%s\n' "${package_assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload release archive
        if: steps.package.outputs.assets != ''
        shell: bash
        env:
          ASSETS: ${{ steps.package.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release upload "$VERSION" "$asset"
          done <<< "$ASSETS"
      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi

  windows-signing:
    name: Sign & Package (${{ matrix.platform }})
    needs: [create-release, build]
    runs-on: windows-latest
    environment: artifact-signing
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            installer_arch: x86_64
          - platform: windows-aarch64
            installer_arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - name: Download unsigned Windows binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-${{ matrix.platform }}
          path: target/release
      - name: Sign in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
          AZURE_LOGIN_POST_CLEANUP: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\keeppeek.exe
            ${{ github.workspace }}\target\release\keeppeek-service.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows binary signatures
        shell: pwsh
        run: |
          foreach ($path in 'target/release/keeppeek.exe', 'target/release/keeppeek-service.exe') {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "$path has invalid signature status: $($signature.Status)"
            }
            if ($null -eq $signature.TimestamperCertificate) {
              throw "$path does not have an RFC 3161 timestamp"
            }
          }
      - name: Install NSIS
        shell: bash
        run: choco install nsis --no-progress --yes
      - name: Build Windows installer
        shell: bash
        env:
          ARCH: ${{ matrix.installer_arch }}
          MSYS2_ARG_CONV_EXCL: "*"
          VERSION: ${{ needs.create-release.outputs.version }}
          VERSION_RESOURCE: ${{ needs.create-release.outputs.version_resource }}
        run: |
          build_dir="$(cygpath -aw target/release)"
          out_dir="$(cygpath -aw .)"
          makensis_args=(
            "/DARCH=$ARCH"
            "/DBUILD_DIR=$build_dir"
            "/DOUT_DIR=$out_dir"
            "/DVERSION=$VERSION"
            "/DVERSION_RESOURCE=$VERSION_RESOURCE"
            installer/keeppeek.nsi
          )
          "C:/Program Files (x86)/NSIS/makensis.exe" "${makensis_args[@]}"
      - name: Sign Windows installer
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\keeppeek-${{ needs.create-release.outputs.version }}-${{ matrix.platform }}-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows installer signature
        shell: pwsh
        env:
          INSTALLER: keeppeek-${{ needs.create-release.outputs.version }}-${{ matrix.platform }}-installer.exe
        run: |
          $signature = Get-AuthenticodeSignature $env:INSTALLER
          if ($signature.Status -ne 'Valid') {
            throw "$env:INSTALLER has invalid signature status: $($signature.Status)"
          }
          if ($null -eq $signature.TimestamperCertificate) {
            throw "$env:INSTALLER does not have an RFC 3161 timestamp"
          }
      - name: Package Windows release
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="keeppeek-${VERSION}-${PLATFORM}"
          mkdir "$archive"
          cp target/release/keeppeek.exe target/release/keeppeek-service.exe "$archive/"

          standalone="keeppeek-${VERSION}-${PLATFORM}.exe"
          cp target/release/keeppeek.exe "$standalone"
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$standalone"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$standalone.sha256"

          installer="keeppeek-${VERSION}-${PLATFORM}-installer.exe"
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$installer"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$installer.sha256"

          asset="$archive.zip"
          7z a "$asset" "$archive"
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$asset"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$asset.sha256"

          package_assets=("$asset" "$asset.sha256" "$standalone" "$standalone.sha256" "$installer" "$installer.sha256")
          for package_asset in "${package_assets[@]}"; do
            if [[ ! -f "$package_asset" ]]; then
              echo "Expected release asset was not created: $package_asset" >&2
              exit 1
            fi
          done
          echo "Packaged release assets:"
          printf '  %s\n' "${package_assets[@]}"
          {
            echo "assets<<EOF"
            printf '%s\n' "${package_assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload Windows release assets
        shell: bash
        env:
          ASSETS: ${{ steps.package.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release upload "$VERSION" "$asset"
          done <<< "$ASSETS"

  container:
    name: Publish container image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-tags
        name: Set container image tags
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
              echo "ghcr.io/$GITHUB_REPOSITORY:$VERSION"
              echo "ghcr.io/$GITHUB_REPOSITORY:latest"
            else
              echo "ghcr.io/$GITHUB_REPOSITORY:master"
              echo "ghcr.io/$GITHUB_REPOSITORY:master-${RELEASE_SHA::7}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
