# How to make a release
# - Update version in Cargo.toml:
#   version = "X.Y.Z"
# - Merge the PR to master.
# - Create a tag with the version number:
#   git tag X.Y.Z
# - Push the tag to GitHub:
#   git push origin X.Y.Z
# - Go to the releases page, edit the draft release, and publish it.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: version
        name: Read release version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Check release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: grep -Fx "version = \"$VERSION\"" Cargo.toml
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            extension: zip
            binary_extension: .exe
          - os: windows-11-arm
            platform: windows-aarch64
            extension: zip
            binary_extension: .exe
          - os: macos-14
            platform: macos-aarch64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-latest
            platform: linux-x86_64
            extension: tar.gz
            binary_extension: ""
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            extension: tar.gz
            binary_extension: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - name: Verify macOS architecture
        if: matrix.platform == 'macos-aarch64'
        run: test "$(uname -m)" = arm64
      - name: Build release binary
        run: cargo build --release --bin keeppeek
      - name: Package release
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_EXTENSION: ${{ matrix.binary_extension }}
        run: |
          archive="keeppeek-${VERSION}-${PLATFORM}"
          mkdir "$archive"
          cp "target/release/keeppeek${BINARY_EXTENSION}" "$archive/"
          if [[ "$PLATFORM" == macos-aarch64 ]]; then
            cp installer/macos/install-macos.sh "$archive/"
            cp installer/macos/com.keeppeek.plist "$archive/"
            chmod +x "$archive/install-macos.sh"
          fi
          if [[ "$EXTENSION" == zip ]]; then
            7z a "$archive.zip" "$archive"
          else
            tar czf "$archive.tar.gz" "$archive"
          fi
          asset="$archive.$EXTENSION"
          python -c 'import hashlib, pathlib; path = pathlib.Path("'"$asset"'"); print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")' > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Upload release archive
        env:
          ASSET: ${{ steps.package.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "$VERSION" "$ASSET" "$ASSET.sha256"
