name: RepoWise

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base branch to compare with
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: repowise-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPOWISE_VERSION: "0.45.0"

jobs:
  change-risk:
    name: Change Risk (Advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RepoWise
        run: python -m pip install "repowise==$REPOWISE_VERSION"
      - name: Analyze change risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_BASE: ${{ inputs.base || 'main' }}
          NO_COLOR: "1"
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            revision_range="$BASE_SHA..$HEAD_SHA"
          else
            revision_range="origin/$MANUAL_BASE..$HEAD_SHA"
          fi

          repowise risk "$revision_range" --format json > repowise-risk.json

          {
            echo "## RepoWise change risk"
            echo
            echo "**Revision range:** \`$revision_range\`"
            echo
            echo '```text'
            repowise risk "$revision_range"
            echo '```'
            echo
            echo "This report is advisory; its score never fails the workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload change-risk report
        uses: actions/upload-artifact@v7
        with:
          name: repowise-change-risk-${{ github.event.pull_request.number || github.run_id }}
          path: repowise-risk.json
          if-no-files-found: error
          retention-days: 14
