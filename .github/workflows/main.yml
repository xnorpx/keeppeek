name: Manual NSIS setup qualification
run-name: NSIS setup for PR 381 at 61d92ea7b98cc64f5f8c23effdff7480f0e525bd
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nsis:
    name: Install and exercise NSIS on a Windows signing runner image
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 61d92ea7b98cc64f5f8c23effdff7480f0e525bd
          persist-credentials: false
      - name: Verify exact source and initial runner state
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '61d92ea7b98cc64f5f8c23effdff7480f0e525bd' -or
              (git rev-parse 'HEAD^{tree}') -ne '27d13a2ab3d55828eb173fdf80782a0231338b65') {
            throw 'The reviewed NSIS source was not checked out.'
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $wasInstalled = Test-Path -LiteralPath $compiler -PathType Leaf
          "NSIS_PREINSTALLED=$wasInstalled" | Add-Content -LiteralPath $env:GITHUB_ENV
          "NSIS preinstalled: $wasInstalled"
      - uses: ./.github/actions/setup-nsis
      - name: Verify compiler and build an installer fixture
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $version = & $compiler '/VERSION'
          if ($LASTEXITCODE -ne 0 -or !$version) { throw 'Installer compiler version unavailable.' }
          if ($env:NSIS_PREINSTALLED -eq 'False' -and $version -notmatch '^v?3\.13(?:\s|$)') {
            throw "Cold setup returned unexpected NSIS version $version"
          }
          "Compiler version: $version"
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            @('OutFile "nsis-qualification.exe"', 'Section', 'SectionEnd') |
              Set-Content -LiteralPath 'nsis-qualification.nsi' -Encoding ascii
            & $compiler '/V2' 'nsis-qualification.nsi'
            if ($LASTEXITCODE -ne 0) { throw 'NSIS did not compile the fixture.' }
            $artifact = Get-Item -LiteralPath 'nsis-qualification.exe'
            if ($artifact.Length -lt 4096) { throw 'Unexpected installer fixture size.' }
            "Compiled installer fixture bytes: $($artifact.Length)"
          } finally {
            Pop-Location
          }
