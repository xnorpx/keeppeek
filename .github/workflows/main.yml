name: Frame-step browser qualification
run-name: Real Linux Chromium frame handoff diagnosis for PR 359
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: canonical-repository-check
          cache-on-failure: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ui/.bun-version
      - uses: ./.github/actions/setup-ffmpeg
      - name: Build actual recorder and numbered RTSP source
        working-directory: ui
        run: |
          bun install --no-save --registry=https://registry.npmjs.org/
          bun x playwright install --with-deps chromium
          bun scripts/build-e2e-binaries.ts
      - name: Witness 24 frame steps and playback handoffs for each input
        working-directory: ui
        env:
          KEEPPEEK_E2E_RUN_ID: linux-frame-clock-diagnosis
          CI: "true"
        run: bun x playwright test exact-frame-step.e2e.ts --workers=1 --retries=0 --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: linux-frame-clock-diagnosis
          path: ui/test-results/playwright/**/error-context.md
          retention-days: 2
