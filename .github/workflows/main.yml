name: Main

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: main-extended-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  slow-rust:
    name: Slow Rust Tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Run opt-in slow test-camera regressions
        env:
          KEEPPEEK_RUN_SLOW_TESTS: "1"
        run: |
          cargo test --locked -p test-camera checked_in_mp4_fixtures_stream_through_both_backends --lib
          cargo test --locked -p test-camera rtsp_camera_streams_main_and_sub_profiles --lib
      - name: Run opt-in storage pipeline regressions
        env:
          KEEPPEEK_RUN_SLOW_TESTS: "1"
        run: cargo test --locked --test storage_pipeline

  rust-coverage:
    name: Rust Coverage
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-llvm-cov
      - uses: ./.github/actions/setup-ffmpeg
      - name: Generate Rust coverage
        run: |
          mkdir -p target/main-coverage/rust
          cargo llvm-cov --locked --workspace --lib --bins --tests --lcov --output-path target/main-coverage/rust/lcov.info
          cargo llvm-cov report --json --output-path target/main-coverage/rust/coverage.json
          cargo llvm-cov report --html --output-dir target/main-coverage/rust/html
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-rust-coverage
          path: target/main-coverage/rust
          if-no-files-found: ignore
          retention-days: 30

  platform-rust:
    name: Main Platform (${{ matrix.os }}${{ matrix.shard != '' && format(' {0}', matrix.shard) || '' }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-11-arm' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            shard: ""
            run_nsis: "false"
          - os: windows-latest
            shard: ""
            run_nsis: "true"
          - os: windows-11-arm
            shard: "1/2"
            run_nsis: "true"
          - os: windows-11-arm
            shard: "2/2"
            run_nsis: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Install and verify Rolldown Linux ARM64 binding
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: ui
        shell: bash
        run: |
          binding='@rolldown/binding-linux-arm64-gnu'
          binding_version="$(bun -e "const packageJson = await Bun.file('node_modules/rolldown/package.json').json(); console.log(packageJson.optionalDependencies['$binding'])")"
          if [[ -z "$binding_version" || "$binding_version" == undefined ]]; then
            echo "Unable to determine $binding version" >&2
            exit 1
          fi
          bun add --no-save --exact "$binding@$binding_version" --registry=https://registry.npmjs.org/
          bun -e "await import('rolldown')"
      - name: Build workspace
        run: cargo build --locked --all
      - name: Set up NSIS
        if: runner.os == 'Windows' && matrix.run_nsis == 'true'
        uses: ./.github/actions/setup-nsis
      - name: Build Windows installer
        if: runner.os == 'Windows' && matrix.run_nsis == 'true'
        id: windows-installer
        shell: pwsh
        run: |
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE 'target\debug'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-installer'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "/DARCH=$architecture" `
            "/DBUILD_DIR=$buildDirectory" `
            "/DOUT_DIR=$outputDirectory" `
            '/DVERSION=0.0.0' `
            '/DVERSION_RESOURCE=0.0.0.0' `
            installer/keeppeek.nsi
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to build the KeepPeek installer'
          }

          $installer = Join-Path $outputDirectory "keeppeek-0.0.0-windows-$architecture-installer.exe"
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "output_directory=$outputDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not (Test-Path $installer)) {
            throw "Installer was not created at $installer"
          }
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows' && matrix.run_nsis == 'true' && steps.windows-installer.outcome == 'success'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.windows-installer.outputs.installer }}
          OUTPUT_DIRECTORY: ${{ steps.windows-installer.outputs.output_directory }}
        run: |
          $zeroDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-install-zero'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-install'
          $serviceName = 'KeepPeekService'
          $installer = $env:INSTALLER
          $desktopShortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\KeepPeek\KeepPeek Desktop.lnk'
          try {
            $zeroProcess = Start-Process -FilePath $installer -ArgumentList @('/S', '/NO_DESKTOP', '/NO_SERVER', '/NO_SERVICE', "/D=$zeroDirectory") -PassThru -Wait
            if ($zeroProcess.ExitCode -eq 0) {
              throw 'Installer must fail when zero components are selected'
            }
            if (Test-Path $zeroDirectory) {
              throw 'Zero-component install must not create the target directory'
            }

            $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/SERVICE', "/D=$installDirectory") -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw 'Unable to install KeepPeek'
            }

            foreach ($binary in 'keeppeek.exe', 'keeppeek-service.exe', 'keeppeek-supervisor.exe', 'keeppeek-desktop.exe', 'uninstall.exe') {
              if (-not (Test-Path (Join-Path $installDirectory $binary))) {
                throw "$binary was not installed"
              }
            }

            if (-not (Test-Path $desktopShortcut)) {
              throw "KeepPeek Desktop Start Menu shortcut was not installed at $desktopShortcut"
            }

            & (Join-Path $installDirectory 'keeppeek-desktop.exe') --help
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed keeppeek-desktop.exe --help failed'
            }

            & (Join-Path $installDirectory 'keeppeek-supervisor.exe') --help
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed keeppeek-supervisor.exe --help failed'
            }

            $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
            if ($null -eq $service -or -not $service.PathName.Contains("$installDirectory\keeppeek-service.exe")) {
              throw "$serviceName was not installed with the expected binary path"
            }

            $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/SERVICE', "/D=$installDirectory") -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw 'Unable to reinstall KeepPeek'
            }
          } finally {
            if (Test-Path (Join-Path $installDirectory 'uninstall.exe')) {
              $process = Start-Process -FilePath (Join-Path $installDirectory 'uninstall.exe') -ArgumentList '/S' -PassThru -Wait
              if ($process.ExitCode -ne 0) {
                throw 'Unable to uninstall KeepPeek'
              }
              $uninstalled = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                $remaining = @('keeppeek.exe', 'keeppeek-service.exe', 'keeppeek-supervisor.exe', 'keeppeek-desktop.exe') |
                  Where-Object { Test-Path (Join-Path $installDirectory $_) }
                if ($remaining.Count -eq 0 -and $null -eq (Get-CimInstance Win32_Service -Filter "Name='$serviceName'")) {
                  $uninstalled = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
              if (-not $uninstalled) {
                throw 'Uninstall did not remove KeepPeek binaries and service within 30 seconds'
              }
            } else {
              & sc.exe delete $serviceName
            }
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue $zeroDirectory, $installDirectory, $env:OUTPUT_DIRECTORY
          }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        if: matrix.os == 'windows-11-arm'
        with:
          tool: nextest
      - uses: ./.github/actions/setup-ffmpeg
        if: matrix.os != 'windows-latest'
      - name: Run platform Rust tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            partition_args=()
            if [[ -n "${{ matrix.shard }}" ]]; then
              partition_args=(--partition "count:${{ matrix.shard }}")
            fi
            cargo nextest run --locked --workspace --lib --bins --tests --test-threads 2 "${partition_args[@]}"
          else
            cargo test --locked --all --lib --bins --tests
          fi

  platform-ui-e2e-build:
    name: Main UI E2E Build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # ponytail: Keep a single build job with a 55-minute limit for cold macOS and Windows fixture builds.
    # Split fixture builds into separate jobs if either runner approaches 55 minutes.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Build shared Playwright binaries and fixtures
        run: bun run test:e2e:prepare
      - name: Build shared authentication browser fixture
        # ponytail: Reuse the compiled release test binary across platform E2E shards.
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/e2e-authentication
          messages="$RUNNER_TEMP/authentication-fixture-build.jsonl"
          features=()
          exe=""
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            features=(--features macos-test-aws-crypto)
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            exe=".exe"
          fi
          build_status=0
          cargo test --locked --release --lib issue123_browser_fixture --no-run --message-format=json "${features[@]}" \
            | head -c 16777217 > "$messages" || build_status=$?
          if [ "$(wc -c < "$messages")" -gt 16777216 ]; then
            echo "Authentication fixture Cargo JSON exceeds 16 MiB" >&2
            exit 1
          fi
          jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' "$messages" >&2
          test "$build_status" -eq 0
          executable=$(jq -ers --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" '
            def norm: gsub("\\\\"; "/") | ascii_downcase;
            [.[] | select(.reason == "compiler-artifact"
              and (.manifest_path | norm) == ($manifest | norm)
              and .target.name == "keeppeek"
              and .target.kind == ["lib"]
              and .profile.test == true
              and (.executable | type == "string" and length > 0)) | .executable]
            | if length == 1 then .[0] else error("Expected exactly one KeepPeek lib-test executable") end
          ' "$messages")
          test -f "$executable"
          cp -- "$executable" "target/e2e-authentication/keeppeek-authentication-fixture${exe}"
      - name: Upload shared Playwright binaries and fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-ui-e2e-${{ matrix.os }}
          path: |
            target/release/keeppeek${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/test_camera${{ runner.os == 'Windows' && '.exe' || '' }}
            target/e2e-mixed-codec
            target/home-assistant-card/dist
            target/e2e-authentication/keeppeek-authentication-fixture${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  platform-ui-e2e:
    name: Main UI E2E (${{ matrix.os }} ${{ matrix.shard }}/2)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [platform-ui-e2e-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version-file: examples/object_detection_service/.python-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Download shared Playwright binaries and fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: main-ui-e2e-${{ matrix.os }}
          path: target
      - name: Restore executable permissions
        if: runner.os != 'Windows'
        working-directory: .
        run: chmod +x target/release/keeppeek target/release/test_camera target/e2e-authentication/keeppeek-authentication-fixture
      - name: Verify Windows storage ACL setup without module autoloading
        if: runner.os == 'Windows' && matrix.shard == 1
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File ../.github/scripts/test-protect-test-directory.ps1
      - name: Run platform Playwright shard
        env:
          KEEPPEEK_PYTHON: ${{ steps.python.outputs.python-path }}
          KEEPPEEK_AUTH_E2E_BINARY: ${{ runner.os == 'Windows' && format('{0}\target\e2e-authentication\keeppeek-authentication-fixture.exe', github.workspace) || format('{0}/target/e2e-authentication/keeppeek-authentication-fixture', github.workspace) }}
        run: bun run test:e2e:run -- --workers=1 --shard=${{ matrix.shard }}/2
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-ui-reports-${{ matrix.os }}-${{ matrix.shard }}-of-2
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  main-gate:
    name: Main Extended Gate
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs:
      [
        slow-rust,
        rust-coverage,
        platform-rust,
        platform-ui-e2e-build,
        platform-ui-e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require every extended main suite
        env:
          SLOW_RUST_RESULT: ${{ needs.slow-rust.result }}
          RUST_COVERAGE_RESULT: ${{ needs.rust-coverage.result }}
          PLATFORM_RUST_RESULT: ${{ needs.platform-rust.result }}
          PLATFORM_UI_BUILD_RESULT: ${{ needs.platform-ui-e2e-build.result }}
          PLATFORM_UI_RESULT: ${{ needs.platform-ui-e2e.result }}
        run: |
          test "$SLOW_RUST_RESULT" = success
          test "$RUST_COVERAGE_RESULT" = success
          test "$PLATFORM_RUST_RESULT" = success
          test "$PLATFORM_UI_BUILD_RESULT" = success
          test "$PLATFORM_UI_RESULT" = success
