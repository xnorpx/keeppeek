name: Manual repository qualification
run-name: Windows regressions PR ${{ inputs.pr }} at ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open KeepPeek pull request
        required: true
        type: string
      revision:
        description: Exact reviewed branch commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-regressions-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows native regressions
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PR_NUMBER: ${{ inputs.pr }}
      KEEPPEEK_RUN_SLOW_TESTS: "1"
      EXPECTED_REVISION: ${{ inputs.revision }}
    steps:
      - name: Verify the pull request and requested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state=="open" and .head.repo.full_name==.base.repo.full_name) | .head.sha')
          test "$actual" = "$EXPECTED_REVISION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-native-library
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ui/.bun-version
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install repository UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Exercise actual Windows recorder and catalog
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          if [[ "$PR_NUMBER" == "346" ]]; then
            filters=(final_native_shutdown_closes_all_retired_events_once configured_camera_without_credentials_remains_degraded export_range_is_limited_to_two_minutes runtime_profile_missing_targets_follow_removal_and_readdition acknowledged_camera_privacy_pause)
          elif [[ "$PR_NUMBER" == "357" ]]; then
            filters=('keeppeek::tests::native::' 'storage::catalog::native_close::tests::')
          else
            exit 2
          fi
          cargo test --locked -p keeppeek --lib -- --test-threads=1 "${filters[@]}" 2>&1 | tee "$RUNNER_TEMP/native.log"
          for filter in "${filters[@]}"; do
            grep -F "$filter" "$RUNNER_TEMP/native.log" | grep -E '[.][.][.] ok[[:space:]]*$'
          done
          grep -E '^test result: ok[.] [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/native.log" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish native results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-results
          path: ${{ runner.temp }}/native.log
          if-no-files-found: error
          retention-days: 5
