name: Manual repository qualification
run-name: Canonical PR ${{ inputs.pr }} at ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open KeepPeek pull request
        required: true
        type: string
      revision:
        description: Exact reviewed branch commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: canonical-qualification-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Linux repository check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NEXTEST_TEST_THREADS: "2"
      KEEPPEEK_RUN_SLOW_TESTS: "1"
      EXPECTED_REVISION: ${{ inputs.revision }}
    steps:
      - name: Verify the pull request and requested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state=="open" and .head.repo.full_name==.base.repo.full_name) | .head.sha')
          test "$actual" = "$EXPECTED_REVISION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: canonical-repository-check
          cache-on-failure: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-nextest@0.9.143,cargo-machete@0.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ui/.bun-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: examples/object_detection_service/.python-version
      - uses: ./.github/actions/setup-ffmpeg
      - name: Set up repository tools
        run: |
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple -r examples/object_detection_service/requirements.txt
          python examples/object_detection_service/generate_protos.py
          cd ui
          bun install --no-save --registry=https://registry.npmjs.org/
          bunx playwright install --with-deps chromium
      - name: Run check.sh on the requested commit
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          ./check.sh
      - name: Confirm the tested revision and source tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD 'HEAD^{tree}' >> "$GITHUB_STEP_SUMMARY"
