name: Manual repository qualification
run-name: Dashboard benchmark PR ${{ inputs.pr }} at ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open KeepPeek pull request
        required: true
        type: string
      revision:
        description: Exact reviewed branch commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dashboard-benchmark-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    name: 30 paired 80-second release benchmark observations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NEXTEST_TEST_THREADS: "2"
      KEEPPEEK_RUN_SLOW_TESTS: "1"
      KEEPPEEK_TUI_BENCHMARK_MEASURE_SECONDS: "80"
      EXPECTED_REVISION: ${{ inputs.revision }}
    steps:
      - name: Verify the pull request and requested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state=="open" and .head.repo.full_name==.base.repo.full_name) | .head.sha')
          test "$actual" = "$EXPECTED_REVISION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dashboard-release-benchmark
          cache-on-failure: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ui/.bun-version
      - name: Install frontend dependencies
        working-directory: ui
        run: |
          bun install --no-save --registry=https://registry.npmjs.org/
          bun x --no-install svelte-kit sync
      - name: Collect release overhead samples
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo test --locked --release -p keeppeek --lib tui::benchmark -- --ignored --nocapture | tee "$RUNNER_TEMP/dashboard-release.log"
          test "$(grep -c '^{.*"pair":' "$RUNNER_TEMP/dashboard-release.log")" = 30
          grep '^{' "$RUNNER_TEMP/dashboard-release.log" | tail -2 >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain paired measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dashboard-paired-measurements
          path: ${{ runner.temp }}/dashboard-release.log
          if-no-files-found: warn
          retention-days: 14
