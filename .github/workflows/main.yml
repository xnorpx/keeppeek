name: Manual main ARM qualification
run-name: ARM image reservation at ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact tested main commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Exercise thumbnail allocations on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      EXPECTED_REVISION: ${{ inputs.revision }}
      RUST_BACKTRACE: "1"
      RUST_LIB_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false
      - name: Verify retained main commit
        shell: bash
        run: |
          test "$EXPECTED_REVISION" = 3301610b43c110ede91f2e582671853b394df85d
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          uname -m
          nproc
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: main-arm-image-reservation
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ui/.bun-version
      - name: Install application UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Repeat real catalog and thumbnail placement tests
        shell: bash
        run: |
          results="$RUNNER_TEMP/arm-image"
          mkdir "$results"
          failure=0
          for round in 1 2 3; do
            if ! cargo test --locked -p keeppeek --lib storage::events::placement_tests -- --nocapture \
              2>&1 | tee "$results/round-$round.log"; then
              failure=1
            fi
          done
          test "$failure" -eq 0
      - name: Retain ARM reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-image-reservation
          path: ${{ runner.temp }}/arm-image
          if-no-files-found: warn
          retention-days: 14
