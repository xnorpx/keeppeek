name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - book/src/**
      - docs/**
      - ui/package.json
      - ui/scripts/build-wiki.ts
      - ui/scripts/publish-wiki.ts
      - ui/scripts/wiki-manifest.ts
      - ui/scripts/wiki-markdown.ts
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'xnorpx/keeppeek' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: wiki-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Validate trusted publication context
        working-directory: ui
        run: >-
          bun scripts/publish-wiki.ts --verify-context
          "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_EVENT_NAME"
      - name: Test and build Wiki pages
        working-directory: ui
        run: bun run wiki:check
      - name: Clone Wiki
        run: |
          wiki_directory="$RUNNER_TEMP/keeppeek-wiki"
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki_directory"
          printf 'WIKI_DIRECTORY=%s\n' "$wiki_directory" >> "$GITHUB_ENV"
      - name: Stage generated Wiki changes
        working-directory: ui
        run: |
          bun scripts/publish-wiki.ts "$WIKI_DIRECTORY" ../target/wiki "$GITHUB_SHA"
          git -C "$WIKI_DIRECTORY" config user.name "github-actions[bot]"
          git -C "$WIKI_DIRECTORY" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$WIKI_DIRECTORY" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$WIKI_DIRECTORY" commit -m "docs: publish source $GITHUB_SHA"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Push Wiki commit
        if: steps.commit.outputs.changed == 'true'
        env:
          WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
        run: |
          set -eu
          askpass="$RUNNER_TEMP/wiki-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$WIKI_PUBLISH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$WIKI_DIRECTORY" push origin HEAD
