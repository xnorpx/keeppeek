name: Generate Demo Videos

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional HTTPS base URL override for the generated manifest
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: generate-demo-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment: demo-videos
    defaults:
      run:
        working-directory: ui
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_LOGIN_PRE_CLEANUP: true
      AZURE_LOGIN_POST_CLEANUP: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg unzip

      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build real-server demo binaries
        run: bun run test:e2e:prepare

      - name: Validate demo registry
        run: |
          bun run demo:typecheck
          bun run demo:check
          bun run test:unit -- \
            src/lib/storybook/demo.spec.ts \
            src/lib/server/storybook/azure-openai-tts.spec.ts \
            src/lib/server/storybook/demo-narration.spec.ts \
            src/lib/server/storybook/demo-video.spec.ts \
            src/lib/server/storybook/video-publish.spec.ts

      - name: Record story demos
        run: bun run demo:render

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate audio-paced narration
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_TTS_DEPLOYMENT: ${{ vars.AZURE_OPENAI_TTS_DEPLOYMENT }}
        run: |
          test -n "$AZURE_OPENAI_ENDPOINT"
          test -n "$AZURE_OPENAI_TTS_DEPLOYMENT"
          test "$AZURE_OPENAI_TTS_DEPLOYMENT" = "keeppeek-demo-tts-gpt-4o-mini-tts"
          AZURE_OPENAI_AUTH_TOKEN="$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken \
            --output tsv)"
          echo "::add-mask::$AZURE_OPENAI_AUTH_TOKEN"
          export AZURE_OPENAI_AUTH_TOKEN
          bun run demo:narrate:all
          unset AZURE_OPENAI_AUTH_TOKEN

      - name: Prepare hosted manifest
        env:
          DEMO_BASE_URL: ${{ inputs.base_url || vars.AZURE_DEMO_BASE_URL }}
        run: |
          test -n "$DEMO_BASE_URL"
          bun run demo:publish:prepare -- \
            test-results/demo-videos/assets \
            "$DEMO_BASE_URL" \
            test-results/demo-videos/manifest.json

      - name: Validate generated artifact
        run: |
          test -f test-results/demo-videos/manifest.json
          test "$(find test-results/demo-videos/assets -maxdepth 1 -name '*.mp4' | wc -l)" -gt 0
          expected_wavs=$(jq -s '[.[].cues | length] | add' \
            test-results/demo-videos/narration/*/manifest.json)
          actual_wavs=$(find test-results/demo-videos/narration -name '*.wav' | wc -l)
          test "$actual_wavs" -eq "$expected_wavs"
          test "$(find test-results/demo-videos -name '*.webm' | wc -l)" -eq 0
          test "$(find test-results/demo-videos -name '*.stream' | wc -l)" -eq 0
          while IFS= read -r narration_manifest; do
            jq -e '.schemaVersion == 1 and (.cues | length > 0)' "$narration_manifest" >/dev/null
            narration_dir=$(dirname "$narration_manifest")
            while IFS=$'\t' read -r file_name expected_bytes expected_sha; do
              wav="$narration_dir/$file_name"
              test -f "$wav"
              test "$(stat --format='%s' "$wav")" -eq "$expected_bytes"
              test "$(sha256sum "$wav" | cut -d ' ' -f 1)" = "$expected_sha"
              ffprobe -v error \
                -show_entries stream=codec_name,codec_type,sample_rate,channels \
                -of json "$wav" |
                jq -e '.streams | length == 1 and
                  .[0].codec_name == "pcm_s16le" and
                  .[0].codec_type == "audio" and
                  .[0].sample_rate == "24000" and
                  .[0].channels == 1' >/dev/null
            done < <(jq -r '.cues[] | [.fileName, (.bytes | tostring), .sha256] | @tsv' \
              "$narration_manifest")
          done < <(find test-results/demo-videos/narration -name manifest.json -print)
          test "$(find test-results/demo-videos/silent -maxdepth 1 -name '*.mp4' | wc -l)" \
            -eq "$(find test-results/demo-videos/assets -maxdepth 1 -name '*.mp4' | wc -l)"
          while IFS= read -r video; do
            ffprobe -v error \
              -show_entries stream=codec_name,codec_type,pix_fmt \
              -of json "$video" |
              jq -e '.streams | length == 1 and
                .[0].codec_name == "h264" and
                .[0].codec_type == "video" and
                .[0].pix_fmt == "yuv420p"' >/dev/null
          done < <(find test-results/demo-videos/silent -maxdepth 1 -name '*.mp4' -print)
          while IFS= read -r video; do
            ffprobe -v error \
              -show_entries stream=codec_name,codec_type,pix_fmt \
              -of json "$video" |
              jq -e '.streams as $streams |
                ($streams | length) == 2 and
                any($streams[]; .codec_name == "h264" and .codec_type == "video" and .pix_fmt == "yuv420p") and
                any($streams[]; .codec_name == "aac" and .codec_type == "audio")' >/dev/null
          done < <(find test-results/demo-videos/assets -maxdepth 1 -name '*.mp4' -print)
          while IFS= read -r metadata; do
            jq -e '.recording.audioCodec == "aac" and
              .recording.streamCount == 2 and
              (.recording.narration.cues | length > 0) and
              any(.recording.narration.cues[]; .freezeDurationMs > 0)' "$metadata" >/dev/null
          done < <(find test-results/demo-videos/assets -maxdepth 1 -name '*.json' -print)
          jq -e '.schemaVersion == 1 and (.videos | length > 0)' \
            test-results/demo-videos/manifest.json >/dev/null

      - name: Upload demo videos
        uses: actions/upload-artifact@v7
        with:
          name: keeppeek-demo-videos
          path: ui/test-results/demo-videos
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        run: |
          count=$(jq '.videos | length' test-results/demo-videos/manifest.json)
          cues=$(find test-results/demo-videos/narration -name '*.wav' | wc -l)
          echo "Generated $count audio-paced story demo video(s) from $cues Azure OpenAI WAV cue(s)." >> "$GITHUB_STEP_SUMMARY"
