name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/visual-harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version

      - name: Install production UI
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/

      - name: Generate SvelteKit metadata
        working-directory: ui
        run: bunx svelte-kit sync

      - name: Install visual harness
        run: bun install --no-save --registry=https://registry.npmjs.org/

      - name: Build Storybook
        run: bun run storybook:build

      - name: Compare approved Loki references and capture candidates
        run: bun run loki:test:ci

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: keeppeek-visual-regression
          path: |
            ui/visual-harness/storybook-static
            ui/visual-harness/.loki/reference
            ui/visual-harness/.loki/current
            ui/visual-harness/.loki/difference
            ui/design/paper/keeppeek-nvr-v34/references/*.png
            ui/design/paper/keeppeek-nvr-v34/storyboard.json
            ui/design/paper/keeppeek-nvr-v34/COVERAGE.md
          if-no-files-found: ignore
          retention-days: 14
