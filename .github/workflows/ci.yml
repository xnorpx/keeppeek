name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check TOML formatting
        run: taplo fmt --check --diff

  book:
    name: Book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook and Mermaid
        run: |
          curl --fail --location https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
          curl --fail --location https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook mdbook-mermaid
          mv mdbook mdbook-mermaid /usr/local/bin/
      - name: Build the book
        run: mdbook build book
      - name: Verify Mermaid output
        run: |
          grep --fixed-strings '<pre class="mermaid">' book/book/users-and-design-choices.html
          grep --extended-regexp 'src="mermaid-[^"]+\.min\.js"' book/book/users-and-design-choices.html
          grep --extended-regexp 'src="mermaid-init-[^"]+\.js"' book/book/users-and-design-choices.html

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - run: cargo clippy --all --all-targets -- -D warnings

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  doctest:
    name: Rust Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - run: cargo test --doc --all

  object-detection-example:
    name: Object Detection Example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version-file: examples/object_detection_service/.python-version
          cache: pip
          cache-dependency-path: examples/object_detection_service/requirements.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
          ffmpeg -version
      - name: Install latest Python dependencies
        working-directory: examples/object_detection_service
        run: python -m pip install --upgrade -r requirements.txt
      - name: Generate and validate MIT protobuf bindings
        working-directory: examples/object_detection_service
        run: |
          python generate_protos.py
          python -c "from pathlib import Path; from generated import webrtc_pb2 as pb; assert pb.DESCRIPTOR.package == 'keeppeek.webrtc.v1'; assert Path('generated/webrtc_pb2.py').read_text(encoding='utf-8').startswith('# SPDX-License-Identifier: MIT')"
      - name: Test startup and media failure paths
        working-directory: examples/object_detection_service
        run: python -m pytest -q tests/test_configuration.py
      - name: Check Python types
        working-directory: examples/object_detection_service
        run: python -m mypy --strict
      - name: Check Python lint and formatting
        working-directory: examples/object_detection_service
        run: |
          python -m black --check .
          python -m ruff check .
          python -m ruff format --check .
      - name: Run deterministic object-detection tests
        working-directory: examples/object_detection_service
        run: python -m pytest -q

  object-detection-integration:
    name: Object Detection Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version-file: examples/object_detection_service/.python-version
          cache: pip
          cache-dependency-path: examples/object_detection_service/requirements.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version
      - name: Install latest Python dependencies
        working-directory: examples/object_detection_service
        run: python -m pip install --upgrade -r requirements.txt
      - name: Generate MIT protobuf bindings
        working-directory: examples/object_detection_service
        run: python generate_protos.py
      - name: Fetch licensed Intel inference video
        shell: bash
        run: |
          git clone --depth 1 https://github.com/intel-iot-devkit/sample-videos.git data/sample-videos
          test "$(git -C data/sample-videos rev-parse HEAD)" = "57978890822836f2b4743852f04f62fc511757e4"
          echo "452b11b7e0efbd019f1d9570d0c790e90416ad4ad29eec6003872d08443140ef  data/sample-videos/person-bicycle-car-detection.mp4" | sha256sum --check --strict
          echo "e7edaaaeb0cd6da6a3dd97c54f3e8443ef027be685253fab64bf6eed2419ee7e  data/sample-videos/LICENSE" | sha256sum --check --strict
          echo "77eac5b69b1901e7d349005dcdb118d83b1fa592b346f5f985fbae61a7a1123b  data/sample-videos/README.md" | sha256sum --check --strict
      - name: Fetch pinned Ultralytics model
        shell: bash
        run: |
          mkdir -p target
          curl --fail --location --retry 3 --output target/yolo11n.pt \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt
          echo "0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  target/yolo11n.pt" | sha256sum --check --strict
      - name: Build KeepPeek integration binaries
        run: cargo build -p keeppeek -p test-camera --bin keeppeek --bin test_camera
      - name: Verify exported media with independent decoders
        env:
          KEEPPEEK_VALIDATE_EXPORT_MEDIA: "1"
        run: cargo test server::tests::export_job_runs_reports_gaps_and_downloads_verified_file --lib
      - name: Publish a real Ultralytics detection to local KeepPeek
        working-directory: examples/object_detection_service
        env:
          KEEPPEEK_RUN_OBJECT_DETECTION_E2E: "1"
          KEEPPEEK_E2E_MODEL: ${{ github.workspace }}/target/yolo11n.pt
        run: python -m pytest -q tests/test_e2e.py

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - if: runner.os != 'Linux'
        run: cargo build --all
      - name: Verify Windows service installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $serviceName = 'KeepPeekService'
          $binaryPath = (Resolve-Path 'target/debug/keeppeek-service.exe').Path
          $installed = $false
          try {
            & sc.exe create $serviceName binPath= "`"$binaryPath`"" start= demand
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to install $serviceName"
            }
            $installed = $true

            $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
            if ($null -eq $service -or -not $service.PathName.Contains($binaryPath)) {
              throw "$serviceName was not installed with the expected binary path"
            }
          } finally {
            if ($installed) {
              & sc.exe delete $serviceName
            }
          }
      - name: Verify macOS app service installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=/Applications/KeepPeek.app
          cleanup() {
            launchctl bootout "gui/$(id -u)/com.keeppeek" >/dev/null 2>&1 || true
            rm -f "$HOME/Library/LaunchAgents/com.keeppeek.plist"
            sudo rm -rf "$app"
          }
          trap cleanup EXIT
          sudo rm -rf "$app"
          sudo mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          sudo cp installer/macos/Info.plist "$app/Contents/Info.plist"
          sudo swiftc installer/macos/KeepPeekLauncher.swift -o "$app/Contents/MacOS/KeepPeek"
          sudo cp target/debug/keeppeek "$app/Contents/Resources/keeppeek"
          sudo chmod 755 "$app/Contents/MacOS/KeepPeek" "$app/Contents/Resources/keeppeek"
          sudo chown -R "$(id -un):$(id -gn)" "$app"
          plutil -lint "$app/Contents/Info.plist"
          KEEPPEEK_NO_UI=1 "$app/Contents/MacOS/KeepPeek"
          launchctl print "gui/$(id -u)/com.keeppeek"
      - name: Run Rust tests
        id: rust-tests
        shell: bash
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cargo test --all --lib --bins --tests --features macos-test-aws-crypto 2>&1 | tee rust-test-results.log
          else
            cargo test --all --lib --bins --tests 2>&1 | tee rust-test-results.log
          fi
      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-log-${{ matrix.os }}
          path: rust-test-results.log
          if-no-files-found: ignore
          retention-days: 14

  windows-signing:
    name: Windows Signing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Build Windows binaries
        run: cargo build --bin keeppeek --bin keeppeek-service
      - name: Sign in to Azure
        uses: azure/login@v3
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
          AZURE_LOGIN_POST_CLEANUP: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\debug\keeppeek.exe
            ${{ github.workspace }}\target\debug\keeppeek-service.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows binary signatures
        shell: pwsh
        run: |
          foreach ($path in 'target/debug/keeppeek.exe', 'target/debug/keeppeek-service.exe') {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "$path has invalid signature status: $($signature.Status)"
            }
            if ($null -eq $signature.TimestamperCertificate) {
              throw "$path does not have an RFC 3161 timestamp"
            }
          }
      - name: Install NSIS
        shell: bash
        run: choco install nsis --no-progress --yes
      - name: Build Windows installer
        id: windows-installer
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE 'target\debug'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-installer'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            '/DARCH=x86_64' `
            "/DBUILD_DIR=$buildDirectory" `
            "/DOUT_DIR=$outputDirectory" `
            '/DVERSION=0.0.0' `
            '/DVERSION_RESOURCE=0.0.0.0' `
            installer/keeppeek.nsi
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to build the KeepPeek installer'
          }

          $installer = Join-Path $outputDirectory 'keeppeek-0.0.0-windows-x86_64-installer.exe'
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not (Test-Path $installer)) {
            throw "Installer was not created at $installer"
          }
      - name: Sign Windows installer
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.windows-installer.outputs.installer }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows installer signature
        shell: pwsh
        env:
          INSTALLER: ${{ steps.windows-installer.outputs.installer }}
        run: |
          $signature = Get-AuthenticodeSignature $env:INSTALLER
          if ($signature.Status -ne 'Valid') {
            throw "$env:INSTALLER has invalid signature status: $($signature.Status)"
          }
          if ($null -eq $signature.TimestamperCertificate) {
            throw "$env:INSTALLER does not have an RFC 3161 timestamp"
          }

  ui-static:
    name: UI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Run static UI quality checks
        run: bun run quality:static
      - name: Build production UI
        run: bun run build

  ui-unit-bun:
    name: UI (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Run Bun-compatible unit tests
        run: bun run test:unit:bun

  ui-e2e-build:
    name: UI E2E Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Build shared Playwright binaries and fixtures
        run: bun run test:e2e:prepare
      - name: Upload shared Playwright binaries and fixtures
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-linux
          path: |
            target/release/keeppeek
            target/release/test_camera
            target/e2e-mixed-codec
          if-no-files-found: error
          retention-days: 1

  ui-e2e:
    name: UI E2E (${{ matrix.shard }}/4)
    needs: ui-e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Download shared Playwright binaries and fixtures
        uses: actions/download-artifact@v8
        with:
          name: ui-e2e-linux
          path: target
      - name: Restore executable permissions
        working-directory: .
        run: chmod +x target/release/keeppeek target/release/test_camera
      - name: Run Playwright shard
        run: bun run test:e2e:run -- --shard=${{ matrix.shard }}/4
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-reports-${{ matrix.shard }}-of-4
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  ui-windows-build:
    name: UI Windows Build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Build production UI on Windows
        run: bun run build

  ui-gate:
    name: UI (windows-latest)
    if: always()
    needs: [ui-e2e-build, ui-e2e, ui-windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every UI integration job
        env:
          E2E_BUILD_RESULT: ${{ needs.ui-e2e-build.result }}
          E2E_RESULT: ${{ needs.ui-e2e.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.ui-windows-build.result }}
        run: |
          test "$E2E_BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$WINDOWS_BUILD_RESULT" = success

  coverage:
    name: Coverage (Rust + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --no-save --registry=https://registry.npmjs.org/
      - name: Install Chromium for Vitest browser tests
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Generate Svelte and TypeScript coverage
        id: ui-coverage
        working-directory: ui
        continue-on-error: true
        run: bun run test:unit:coverage:ci
      - name: Write coverage summary
        if: always()
        shell: bash
        env:
          UI_COVERAGE_OUTCOME: ${{ steps.ui-coverage.outcome }}
        run: |
          {
            echo '## Fast coverage'
            echo
            echo '| Suite | Lines | Functions | Branches |'
            echo '| --- | ---: | ---: | ---: |'
            if [[ -f ui/coverage/coverage-summary.json ]]; then
              jq -r '
                def percentage: if . == null then "n/a" else "\(.)%" end;
                .total as $total |
                "| Vitest-owned UI | \($total.lines.pct | percentage) | \($total.functions.pct | percentage) | \($total.branches.pct | percentage) |"
              ' ui/coverage/coverage-summary.json
            else
              echo '| Vitest-owned UI | n/a | n/a | n/a |'
            fi
            echo
            echo "Vitest: \`${UI_COVERAGE_OUTCOME:-not-run}\`"
            echo
            echo 'Bun-compatible tests run once in their own required job. Rust coverage runs in Nightly.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: ui/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail when coverage generation fails
        if: always() && steps.ui-coverage.outcome != 'success'
        run: exit 1

  main-release-gate:
    name: Main Release Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        fmt,
        book,
        clippy,
        machete,
        build-and-test,
        ui-static,
        ui-unit-bun,
        ui-gate,
        coverage,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo 'Main is ready for signed release builds.'

  quality-report:
    name: Quality Report
    if: always() && github.event_name == 'pull_request'
    needs:
      [
        fmt,
        clippy,
        machete,
        build-and-test,
        ui-static,
        ui-unit-bun,
        ui-e2e-build,
        ui-e2e,
        ui-windows-build,
        ui-gate,
        coverage,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: quality-reports/coverage

      - name: Write quality report and update pull request
        uses: actions/github-script@v9
        env:
          COVERAGE_DIRECTORY: quality-reports/coverage
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- keeppeek-quality-report -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checkNames = [
              'Format',
              'Clippy',
              'Unused Dependencies',
              'Build & Test (ubuntu-latest)',
              'Build & Test (macos-latest)',
              'Build & Test (windows-latest)',
              'UI (ubuntu-latest)',
              'UI (macos-latest)',
              'UI E2E Build',
              'UI E2E (1/4)',
              'UI E2E (2/4)',
              'UI E2E (3/4)',
              'UI E2E (4/4)',
              'UI Windows Build',
              'UI (windows-latest)',
              'Coverage (Rust + UI)'
            ];

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const jobsByName = new Map(jobs.map((job) => [job.name, job]));
            const statusIcon = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⚪'
            };
            const formatStatus = (job) => {
              const status = job?.conclusion ?? job?.status ?? 'not run';
              return `${statusIcon[status] ?? '⚠️'} ${status}`;
            };
            const findFile = (directory, fileName) => {
              if (!fs.existsSync(directory)) return undefined;
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isFile() && entry.name === fileName) return entryPath;
                if (entry.isDirectory()) {
                  const result = findFile(entryPath, fileName);
                  if (result) return result;
                }
              }
              return undefined;
            };
            const readJson = (fileName) => {
              const report = findFile(path.join(process.env.GITHUB_WORKSPACE, process.env.COVERAGE_DIRECTORY), fileName);
              if (!report) return undefined;
              try {
                return JSON.parse(fs.readFileSync(report, 'utf8'));
              } catch (error) {
                core.warning(`Unable to parse ${fileName}: ${error.message}`);
                return undefined;
              }
            };
            const metric = (totals, key) => {
              const value = totals?.[key]?.percent ?? totals?.[key]?.pct;
              return typeof value === 'number' ? `${value.toFixed(1)}%` : 'n/a';
            };

            const uiTotals = readJson('coverage-summary.json')?.total;
            const checkRows = checkNames
              .map((name) => `| ${name} | ${formatStatus(jobsByName.get(name))} |`)
              .join('\n');
            const report = [
              '## Quality Report',
              '',
              '### Checks',
              '',
              '| Check | Result |',
              '| --- | --- |',
              checkRows,
              '',
              '### Coverage',
              '',
              '| Runtime | Lines | Functions | Branches |',
              '| --- | ---: | ---: | ---: |',
              `| Vitest-owned UI | ${metric(uiTotals, 'lines')} | ${metric(uiTotals, 'functions')} | ${metric(uiTotals, 'branches')} |`,
              '| Rust | nightly | nightly | nightly |',
              '',
              `[Open workflow run and artifacts](${runUrl})`
            ].join('\n');

            await core.summary.addRaw(report).write();

            const pullRequest = context.payload.pull_request;
            if (!pullRequest || pullRequest.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.info('Skipping pull request comment for an external contribution.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100
            });
            const existingComment = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            const body = `${marker}\n${report}`;
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body
              });
            }
