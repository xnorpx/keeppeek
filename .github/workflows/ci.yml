name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check TOML formatting
        run: taplo fmt --check --diff
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Check Markdown formatting
        run: bunx prettier --check "**/*.md"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - run: cargo clippy --all --all-targets -- -D warnings

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - run: cargo build --all
      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        id: windows-signing
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $values = @(
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID
          )
          $enabled = ($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -eq $values.Count
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Sign in to Azure
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries
        id: sign-windows-binaries
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\debug\keeppeek.exe
            ${{ github.workspace }}\target\debug\keeppeek-service.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows binary signatures
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true' && steps.sign-windows-binaries.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($path in 'target/debug/keeppeek.exe', 'target/debug/keeppeek-service.exe') {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "$path has invalid signature status: $($signature.Status)"
            }
            if ($null -eq $signature.TimestamperCertificate) {
              throw "$path does not have an RFC 3161 timestamp"
            }
          }
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nsis --no-progress --yes
      - name: Build Windows installer binaries
        if: runner.os == 'Windows'
        run: cargo build --bin keeppeek --bin keeppeek-service
      - name: Build Windows installer
        if: runner.os == 'Windows'
        id: windows-installer
        shell: pwsh
        run: |
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE 'target\debug'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-installer'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "/DARCH=$architecture" `
            "/DBUILD_DIR=$buildDirectory" `
            "/DOUT_DIR=$outputDirectory" `
            '/DVERSION=0.0.0' `
            '/DVERSION_RESOURCE=0.0.0.0' `
            installer/keeppeek.nsi
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to build the KeepPeek installer'
          }

          $installer = Join-Path $outputDirectory "keeppeek-0.0.0-windows-$architecture-installer.exe"
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "output_directory=$outputDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not (Test-Path $installer)) {
            throw "Installer was not created at $installer"
          }
      - name: Sign Windows installer
        id: sign-windows-installer
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true' && steps.windows-installer.outcome == 'success'
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.windows-installer.outputs.installer }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true' && steps.sign-windows-installer.outcome == 'success'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.windows-installer.outputs.installer }}
        run: |
          $signature = Get-AuthenticodeSignature $env:INSTALLER
          if ($signature.Status -ne 'Valid') {
            throw "$env:INSTALLER has invalid signature status: $($signature.Status)"
          }
          if ($null -eq $signature.TimestamperCertificate) {
            throw "$env:INSTALLER does not have an RFC 3161 timestamp"
          }
      - name: Verify Windows installer
        if: runner.os == 'Windows' && steps.windows-installer.outcome == 'success'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.windows-installer.outputs.installer }}
          OUTPUT_DIRECTORY: ${{ steps.windows-installer.outputs.output_directory }}
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP 'keeppeek-install'
          $serviceName = 'KeepPeekService'
          $installer = $env:INSTALLER
          try {
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/SERVICE', "/D=$installDirectory") -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw 'Unable to install KeepPeek'
            }

            foreach ($binary in 'keeppeek.exe', 'keeppeek-service.exe') {
              if (-not (Test-Path (Join-Path $installDirectory $binary))) {
                throw "$binary was not installed"
              }
            }

            $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
            if ($null -eq $service -or -not $service.PathName.Contains("$installDirectory\keeppeek-service.exe")) {
              throw "$serviceName was not installed with the expected binary path"
            }

            $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/SERVICE', "/D=$installDirectory") -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw 'Unable to reinstall KeepPeek'
            }
          } finally {
            if (Test-Path (Join-Path $installDirectory 'uninstall.exe')) {
              $process = Start-Process -FilePath (Join-Path $installDirectory 'uninstall.exe') -ArgumentList '/S' -PassThru -Wait
              if ($process.ExitCode -ne 0) {
                throw 'Unable to uninstall KeepPeek'
              }
            } else {
              & sc.exe delete $serviceName
            }
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue $installDirectory, $env:OUTPUT_DIRECTORY
          }
      - name: Verify Windows service installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $serviceName = 'KeepPeekService'
          $binaryPath = (Resolve-Path 'target/debug/keeppeek-service.exe').Path
          $installed = $false
          try {
            & sc.exe create $serviceName binPath= "`"$binaryPath`"" start= demand
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to install $serviceName"
            }
            $installed = $true

            $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
            if ($null -eq $service -or -not $service.PathName.Contains($binaryPath)) {
              throw "$serviceName was not installed with the expected binary path"
            }
          } finally {
            if ($installed) {
              & sc.exe delete $serviceName
            }
          }
      - name: Verify macOS app service installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=/Applications/KeepPeek.app
          cleanup() {
            launchctl bootout "gui/$(id -u)/com.keeppeek" >/dev/null 2>&1 || true
            rm -f "$HOME/Library/LaunchAgents/com.keeppeek.plist"
            sudo rm -rf "$app"
          }
          trap cleanup EXIT
          sudo rm -rf "$app"
          sudo mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          sudo cp installer/macos/Info.plist "$app/Contents/Info.plist"
          sudo swiftc installer/macos/KeepPeekLauncher.swift -o "$app/Contents/MacOS/KeepPeek"
          sudo cp target/debug/keeppeek "$app/Contents/Resources/keeppeek"
          sudo chmod 755 "$app/Contents/MacOS/KeepPeek" "$app/Contents/Resources/keeppeek"
          sudo chown -R "$(id -un):$(id -gn)" "$app"
          plutil -lint "$app/Contents/Info.plist"
          KEEPPEEK_NO_UI=1 "$app/Contents/MacOS/KeepPeek"
          launchctl print "gui/$(id -u)/com.keeppeek"
      - name: Run Rust tests
        id: rust-tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --all 2>&1 | tee rust-test-results.log
      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-log-${{ matrix.os }}
          path: rust-test-results.log
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2,cargo-nextest@0.9.143
      - run: bun install --registry=https://registry.npmjs.org/
      - if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: bunx playwright install chromium
      - if: runner.os == 'Windows'
        id: ui-check-windows
        shell: cmd
        run: ..\check.bat
      - if: runner.os != 'Windows'
        id: ui-check-unix
        run: ../check.sh
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage (Rust + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --registry=https://registry.npmjs.org/
      - name: Install Chromium for Vitest browser tests
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Install Rust coverage tooling
        id: install-rust-coverage
        continue-on-error: true
        run: cargo install cargo-llvm-cov
      - name: Generate Rust coverage
        id: rust-coverage
        if: steps.install-rust-coverage.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p target/ci-coverage/rust
          cargo llvm-cov --workspace --all-targets --lcov --output-path target/ci-coverage/rust/lcov.info
          cargo llvm-cov report --json --output-path target/ci-coverage/rust/coverage.json
          cargo llvm-cov report --html --output-dir target/ci-coverage/rust
      - name: Install Vitest coverage provider
        id: install-ui-coverage
        if: always()
        working-directory: ui
        continue-on-error: true
        run: bun add --dev --exact --no-save @vitest/coverage-v8@4.1.10 --registry=https://registry.npmjs.org/
      - name: Generate Svelte and TypeScript coverage
        id: ui-coverage
        if: always() && steps.install-ui-coverage.outcome == 'success'
        working-directory: ui
        continue-on-error: true
        run: bun run test:unit:coverage
      - name: Write coverage summary
        if: always()
        shell: bash
        env:
          RUST_COVERAGE_OUTCOME: ${{ steps.rust-coverage.outcome }}
          UI_COVERAGE_OUTCOME: ${{ steps.ui-coverage.outcome }}
        run: |
          {
            echo '## Coverage'
            echo
            echo '| Runtime | Lines | Functions | Branches |'
            echo '| --- | ---: | ---: | ---: |'
            if [[ -f target/ci-coverage/rust/coverage.json ]]; then
              jq -r '
                def percentage: if . == null then "n/a" else "\(.)%" end;
                .data[0].totals as $total |
                "| Rust | \($total.lines.percent | percentage) | \($total.functions.percent | percentage) | \($total.branches.percent | percentage) |"
              ' target/ci-coverage/rust/coverage.json
            else
              echo '| Rust | n/a | n/a | n/a |'
            fi
            if [[ -f ui/coverage/coverage-summary.json ]]; then
              jq -r '
                def percentage: if . == null then "n/a" else "\(.)%" end;
                .total as $total |
                "| Svelte / TypeScript | \($total.lines.pct | percentage) | \($total.functions.pct | percentage) | \($total.branches.pct | percentage) |"
              ' ui/coverage/coverage-summary.json
            else
              echo '| Svelte / TypeScript | n/a | n/a | n/a |'
            fi
            echo
            echo '### Coverage commands'
            echo "- Rust: \`${RUST_COVERAGE_OUTCOME:-not-run}\`"
            echo "- Vitest: \`${UI_COVERAGE_OUTCOME:-not-run}\`"
            echo
            echo "Download the \`coverage-reports\` artifact for LCOV, JSON, and HTML reports."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            target/ci-coverage/rust
            ui/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail when coverage generation fails
        if: always() && (steps.install-rust-coverage.outcome != 'success' || steps.rust-coverage.outcome != 'success' || steps.install-ui-coverage.outcome != 'success' || steps.ui-coverage.outcome != 'success')
        run: exit 1

  main-release-gate:
    name: Main Release Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, machete, build-and-test, ui, coverage]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Main is ready for signed release builds.'

  quality-report:
    name: Quality Report
    if: always() && github.event_name == 'pull_request'
    needs: [fmt, clippy, machete, build-and-test, ui, coverage]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: quality-reports/coverage

      - name: Write quality report and update pull request
        uses: actions/github-script@v9
        env:
          COVERAGE_DIRECTORY: quality-reports/coverage
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- keeppeek-quality-report -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checkNames = [
              'Format',
              'Clippy',
              'Unused Dependencies',
              'Build & Test (ubuntu-latest)',
              'Build & Test (ubuntu-24.04-arm)',
              'Build & Test (macos-latest)',
              'Build & Test (windows-latest)',
              'Build & Test (windows-11-arm)',
              'UI (ubuntu-latest)',
              'UI (macos-latest)',
              'UI (windows-latest)',
              'Coverage (Rust + UI)'
            ];

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const jobsByName = new Map(jobs.map((job) => [job.name, job]));
            const statusIcon = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⚪'
            };
            const formatStatus = (job) => {
              const status = job?.conclusion ?? job?.status ?? 'not run';
              return `${statusIcon[status] ?? '⚠️'} ${status}`;
            };
            const findFile = (directory, fileName) => {
              if (!fs.existsSync(directory)) return undefined;
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isFile() && entry.name === fileName) return entryPath;
                if (entry.isDirectory()) {
                  const result = findFile(entryPath, fileName);
                  if (result) return result;
                }
              }
              return undefined;
            };
            const readJson = (fileName) => {
              const report = findFile(path.join(process.env.GITHUB_WORKSPACE, process.env.COVERAGE_DIRECTORY), fileName);
              if (!report) return undefined;
              try {
                return JSON.parse(fs.readFileSync(report, 'utf8'));
              } catch (error) {
                core.warning(`Unable to parse ${fileName}: ${error.message}`);
                return undefined;
              }
            };
            const metric = (totals, key) => {
              const value = totals?.[key]?.percent ?? totals?.[key]?.pct;
              return typeof value === 'number' ? `${value.toFixed(1)}%` : 'n/a';
            };

            const rustTotals = readJson('coverage.json')?.data?.[0]?.totals;
            const uiTotals = readJson('coverage-summary.json')?.total;
            const checkRows = checkNames
              .map((name) => `| ${name} | ${formatStatus(jobsByName.get(name))} |`)
              .join('\n');
            const report = [
              '## Quality Report',
              '',
              '### Checks',
              '',
              '| Check | Result |',
              '| --- | --- |',
              checkRows,
              '',
              '### Coverage',
              '',
              '| Runtime | Lines | Functions | Branches |',
              '| --- | ---: | ---: | ---: |',
              `| Rust | ${metric(rustTotals, 'lines')} | ${metric(rustTotals, 'functions')} | ${metric(rustTotals, 'branches')} |`,
              `| Svelte / TypeScript | ${metric(uiTotals, 'lines')} | ${metric(uiTotals, 'functions')} | ${metric(uiTotals, 'branches')} |`,
              '',
              `[Open workflow run and artifacts](${runUrl})`
            ].join('\n');

            await core.summary.addRaw(report).write();

            const pullRequest = context.payload.pull_request;
            if (!pullRequest || pullRequest.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.info('Skipping pull request comment for an external contribution.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100
            });
            const existingComment = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            const body = `${marker}\n${report}`;
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body
              });
            }
