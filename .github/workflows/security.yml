name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  dependency-audit:
    name: Dependency Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/.bun-version
      - name: Audit current public npm resolution
        shell: bash
        run: |
          set -e -o pipefail
          audit_manifest() {
            manifest="$1"
            name="$2"
            audit_directory="$RUNNER_TEMP/$name"
            mkdir -p "$audit_directory"
            cp "$manifest" "$audit_directory/package.json"
            (
              cd "$audit_directory"
              bun install --lockfile-only --ignore-scripts --registry=https://registry.npmjs.org/
              bun audit --audit-level high
            )
          }
          audit_manifest ui/package.json keeppeek-ui-audit
          audit_manifest ui/visual-harness/package.json keeppeek-visual-harness-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: examples/object_detection_service/.python-version
      - name: Audit current public PyPI resolution
        working-directory: examples/object_detection_service
        env:
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --index-url https://pypi.org/simple --requirement requirements.txt

  codeql-typescript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
