name: Deploy mdBook to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mdBook and Mermaid
        run: |
          mdbook_archive=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          mermaid_archive=mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --output "$mdbook_archive" "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$mdbook_archive"
          curl --fail --location --output "$mermaid_archive" "https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/$mermaid_archive"
          printf '%s  %s\n' \
            3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 "$mdbook_archive" \
            9afcfa5b8463afe606d48595a7ae338564302903e626ea5b6edb8007d29393a5 "$mermaid_archive" \
            | sha256sum --check --strict
          tar xzf "$mdbook_archive"
          tar xzf "$mermaid_archive"
          rm "$mdbook_archive" "$mermaid_archive"
          chmod +x mdbook mdbook-mermaid
          mv mdbook mdbook-mermaid /usr/local/bin/
      - name: Build the book
        run: mdbook build book
      - name: Copy .nojekyll to book output
        run: cp .nojekyll book/book/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
