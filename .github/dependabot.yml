version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    groups:
      rust-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    groups:
      ui-dependencies:
        patterns:
          - "*"
    ignore:
      # Svelte tooling requires the direct package to remain on TS 6; TS 7 is consumed through @typescript/native.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /examples/object_detection_service
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    groups:
      object-detection-python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
